.sw.on{background:var(--ink)} .sw.on i{transform:translateX(16px)}
.cp-rp{display:flex;flex-direction:column;gap:8px;margin-top:6px;animation:rise .25s var(--ease)}
.rsel{display:flex;gap:6px;flex-wrap:wrap}
.rchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 3px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:12.5px;font-weight:600;max-width:100%}
.rchip img{width:24px;height:24px;border-radius:5px;flex:none}
.rchip svg{width:12px;height:12px;opacity:.7;flex:none}

.rrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto 22px;gap:10px;align-items:center;width:100%;height:48px;padding:0 8px 0 6px;border-radius:9px;text-align:left;transition:background .12s}

.rrow .ck svg{width:12px;height:12px}
.rrow.on{background:var(--card)}
.rrow.on .ck{background:var(--ink);box-shadow:none;color:var(--paper)}
.rnone{padding:18px;text-align:center;font-size:13px;color:var(--ink-3)}

/* ================= 社区骨架 ================= */
.bdg{position:absolute;min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#141418;font:800 10.5px/18px var(--f-b);text-align:center;padding:0 5px;font-style:normal;pointer-events:none}

/* 短视频 */

/* 3 · 鼓：一堆水泥管。三面大鼓并排落在底线上，小鼓卡在两根管子之间的凹槽里，按音高从大到小 */

    {c:'blue', d:'clap', l:'CLAP', r:.62, on:[0,1]}, {c:'pink', d:'perc', tone:.7, l:'GLASS', r:.5, on:[1,2]}, {c:'yellow', d:'hat', l:'HAT', r:.4, on:[3,4]}

    leave(){ hover = null; }

/* 4 · 琴弦：像一架竖琴，低音弦长、高音弦短，所有弦落在同一根黄色琴码上；划过去会抖，按下后划过就有声音 */

  const cross = (a, b, sound, y) => { if (a === null) return; const lo = Math.min(a, b), hi = Math.max(a, b); STR.forEach(s => { const x = sx(s); if (x > lo && x <= hi && (y === undefined || y > top(s) - 6)) pluck(s, sound); }); };

  return {
    draw(g, W, H, t, dt){

      if (!B.touched && !B.ptr.in){ if (ghost < 0 && t - gT > nextG){ ghost = 0; gT = t; } if (ghost >= 0){ const k = (t - gT)/1100; const prev = ghost; ghost = k; const X = G.x(-.2 + prev*6.4), X2 = G.x(-.2 + k*6.4); cross(X, X2, false); g.fillStyle = inkA(.35); g.beginPath(); g.arc(X2, G.y(3.2) + Math.sin(k*6)*10, 9, 0, Math.PI*2); g.fill(); if (k >= 1){ ghost = -1; gT = t; nextG = 3200; } } }

    claims(x, y){ return inBand(x, y); },

    down(x, y){ armed = true; let best = STR[0], bd = 1e9; STR.forEach(s => { const d = Math.abs(sx(s) - x); if (d < bd){ bd = d; best = s; } }); if (inBand(x, y)) pluck(best, true); px = x; },

/* 5 · 盖章：蓝色半圆坐在底线上，粉色圆落在同一根中轴上；光标就是一枚印章 */

    },

/* 当前页面属于哪个板块的搜索；null = 不显示搜索 */

  if (['me','seller','admin'].includes(r) || h === '#user-' + ME) return null;
  if (r === 'shop' || r === 'item') return 'shop';
  if (r === 'msg') return 'msg';
  if (r === 'user') return UI.lastTab === 'me' ? null : UI.lastTab === 'shop' ? 'shop' : UI.lastTab === 'msg' ? 'msg' : 'all';
  return 'all'; }
function syncSearchBtn(){ const s = searchScope(), hd = $('#hd'), b = $('#hd .sbtn'); if (!hd) return; hd.dataset.s = s || 'none';
  if (b && s){ b.querySelector('.t').textContent = SCOPES[s].btn; b.setAttribute('aria-label', SCOPES[s].lab); } }
document.addEventListener('rendered', syncSearchBtn);
document.addEventListener('rendered', () => { const r = routeOf(CUR.hash), meRoot = r === 'me' && !parentOf(CUR.hash);
  $('#hd').classList.toggle('at-home', r === 'home'); $('#hd').classList.toggle('at-me', meRoot);
  document.documentElement.classList.toggle('no-hd', !parentOf(CUR.hash)); });   // 一级页面在手机上没有顶栏
function contactIds(){ return [...new Set([...Object.keys(CHATS), ...STATE.follows])].filter(id => USERS[id] && id !== ME); }
function openSearch(scope, tab){
  scope = scope === undefined ? searchScope() : scope; if (!scope || $('#srch')) return; const S = SCOPES[scope];
  UI.stabs ||= {}; UI.stabs[scope] = tab || null;   // 没手动选过页签时，自动停在第一个有结果的页签
  SHIST.k = scope === 'all' ? 'shist' : 'shist-' + scope; SHIST.def = S.hist;
  const el = document.createElement('div'); el.className = 'srch'; el.id = 'srch'; el.dataset.s = scope;
  el.innerHTML = `<div class="srch-in"><div style="display:flex;align-items:center;gap:12px;margin-bottom:10px"><button class="hd-back" style="display:grid" data-act="sclose" aria-label="返回">${IC.back}</button><span class="lab">${S.lab}</span></div><div class="sq-w"><input id="sq" type="search" placeholder="${S.ph}" autocomplete="off" enterkeyhint="search"><button class="sq-x" data-act="sclear" aria-label="清空输入" tabindex="-1">${IC.x}</button></div><div id="sres"></div></div>`;
  document.body.appendChild(el); document.documentElement.style.overflow = 'hidden';
  const q = $('#sq'); q.focus(); let sel = 0;
  const draw = () => {
    const v = q.value.trim().toLowerCase(); const hl = s => { const t = esc(s); if (!v) return t; const i = s.toLowerCase().indexOf(v); return i < 0 ? t : esc(s.slice(0,i)) + '<mark>' + esc(s.slice(i, i + v.length)) + '</mark>' + esc(s.slice(i + v.length)); };
    q.parentNode.classList.toggle('has', !!q.value);
    if (!v){ const h = SHIST.list(), tries = S.tries || contactIds().slice(0, 8).map(id => USERS[id].name);
      $('#sres').innerHTML = (h.length ? `<div class="sr-g sh-g"><div class="sh-hd"><span class="lab">最近搜索</span><button class="sh-clr" data-act="shist-clr">清空</button></div><div class="sh-list">${h.map(s => `<span class="chip sh-c"><button class="sh-t" data-act="sfill" data-v="${esc(s)}">${IC.clock || ''}${esc(s)}</button><button class="sh-d" data-act="shist-del" data-v="${esc(s)}" aria-label="删除这条记录">${IC.x}</button></span>`).join('')}</div></div>` : '') + (tries.length ? `<div class="sr-g"><span class="lab">${S.tries ? '试试' : '最近联系'}</span><div class="rail" style="flex-wrap:wrap;margin-top:10px">${tries.map(s => `<button class="chip" data-act="sfill" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>` : ''); return; }
    const G = {};
    if (scope === 'msg'){
      G.contact = contactIds().filter(id => (USERS[id].name + USERS[id].role).toLowerCase().includes(v))
        .map(id => ({go:'msg-' + id, av:id, t:hl(USERS[id].name), s:CHATS[id] ? USERS[id].role : USERS[id].role + ' · 发起私信'}));
      G.chat = Object.keys(CHATS).filter(id => USERS[id]).flatMap(id => CHATS[id].map(m => ({id, m, txt:msgPreview({...m, me:false})})))
        .filter(x => x.txt.toLowerCase().includes(v)).sort((a, b) => b.m.ts - a.m.ts)
        .map(x => { const i = x.txt.toLowerCase().indexOf(v), st = Math.max(0, i - 12); return {go:'msg-' + x.id, av:x.id, t:esc(USERS[x.id].name) + ` <small style="font-weight:500;color:var(--ink-3)">${ago(x.m.ts)}</small>`, sh:(x.m.me ? '我：' : '') + (st ? '…' : '') + hl(x.txt.slice(st))}; });
    } else {
      G.prod = PRODUCTS.filter(p => onSale(p) && (p.title + p.en + p.compat + p.desc + (p.price === 0 ? '免费' : '')).toLowerCase().includes(v))
        .map(p => ({go:'item-' + p.id, img:cover(p.cover, hash(p.id)%50, 120, 120), t:hl(p.title), s:`${p.en} · ${yuan(p.price)}`}));
      if (scope === 'all'){
        G.post = POSTS.filter(p => (p.title + p.ex + p.tags.join(' ') + (p.type === 'question' ? '提问' : '')).toLowerCase().includes(v))
          .map(p => ({go:'post-' + p.id, img:p.cover ? cover(p.cover, hash(p.id)%50, 120, 120) : null, t:hl(p.title), s:`${USERS[p.author].name} · ${typeTagCN[p.type]}`}));
        G.user = Object.values(USERS).filter(u => (u.name + u.role + u.bio).toLowerCase().includes(v)).map(u => ({go:'user-' + u.id, av:u.id, t:hl(u.name), s:u.role}));
      }
    }
    const keys = S.tabs.map(([k]) => k), tab = keys.includes(UI.stabs[scope]) ? UI.stabs[scope] : (keys.find(k => G[k].length) || keys[0]), rows = G[tab];
    sel = clamp(sel, 0, Math.max(0, rows.length - 1));
    const tabs = keys.length < 2 ? '' : `<div class="s-tabs" role="tablist">${S.tabs.map(([k,l]) => `<button role="tab" aria-selected="${k === tab}" class="${k === tab ? 'on' : ''} ${G[k].length ? '' : 'nil'}" data-act="srtab" data-v="${k}">${l}<i>${G[k].length}</i></button>`).join('')}</div>`;
    let body;
    if (!rows.length){
      const alt = keys.find(k => G[k].length);
      body = `<div class="empty" style="align-items:flex-start;padding-inline:0"><span class="x" style="font-size:44px">没找到</span><span>${alt ? `<button class="pill" data-act="srtab" data-v="${alt}">看 ${G[alt].length} ${S.unit[alt]}</button>` : S.none ? `换个词，或者<a href="${S.none[1]}" style="text-decoration:underline">${S.none[0]}</a>` : '换个词试试'}</span></div>`;
    } else body = `<div class="s-list">` + rows.map((r, k) => `<div class="sr-row ${k === sel ? 'kb-on' : ''}" data-sgo="${r.go}">${r.av ? av(r.av) : r.img ? `<img src="${r.img}" alt="">` : `<span class="av c-yellow" style="border-radius:10px;font:900 26px/1 var(--f-x)">?</span>`}<div style="min-width:0"><b>${r.t}</b><span>${r.sh || esc(r.s)}</span></div>${IC.arrow.replace('<svg','<svg width="16" height="16"')}</div>`).join('') + `</div>`;
    $('#sres').innerHTML = tabs + body;
  };
  q.addEventListener('input', () => { sel = 0; draw(); });
  q.addEventListener('keydown', e => { const rows = $$('.sr-row'); if (e.key === 'ArrowDown'){ sel = Math.min(rows.length - 1, sel + 1); draw(); e.preventDefault(); } if (e.key === 'ArrowUp'){ sel = Math.max(0, sel - 1); draw(); e.preventDefault(); } if (e.key === 'Enter'){ SHIST.add(q.value); if (rows[sel]){ closeSearch(); go(rows[sel].dataset.sgo); } } if (e.key === 'Escape' && q.value){ e.preventDefault(); e.stopPropagation(); ACTIONS.sclear(); } });
  el.addEventListener('click', e => { const r = e.target.closest('[data-sgo]'); if (r){ SHIST.add(q.value); closeSearch(); go(r.dataset.sgo); } });
  el._draw = draw;
  draw();
}
const typeTagCN = {image:'图文', audio:'声音', video:'视频', question:'提问'};
function closeSearch(){ const el = $('#srch'); if (!el) return; el.remove(); if (!CUR.post) document.documentElement.style.overflow = ''; }
ACTIONS.sclose = () => closeSearch();
/* 历史搜索：每个板块各记最近 10 条，去重，新的在前 */
const SHIST = {
  k:'shist', def:[],
  list(){ return store.get(this.k, this.def); },
  save(a){ store.set(this.k, a.slice(0, 10)); },
  add(v){ v = String(v || '').trim(); if (!v) return; this.save([v, ...this.list().filter(x => x.toLowerCase() !== v.toLowerCase())]); },
  del(v){ this.save(this.list().filter(x => x !== v)); }
};
const sRedraw = () => $('#srch')?._draw?.();
/* 搜索结果的页签（不要和工作室页签的 stab 重名，否则会覆盖掉它） */
ACTIONS.srtab = b => { const sc = $('#srch')?.dataset.s || 'all'; inkSlide('#srch .s-tabs', () => { (UI.stabs ||= {})[sc] = b.dataset.v; sRedraw(); }); const q = $('#sq'); if (q && !IS_MOBILE) q.focus(); };
ACTIONS.sclear = () => { const q = $('#sq'); if (!q) return; q.value = ''; q.dispatchEvent(new Event('input')); q.focus(); };
ACTIONS['shist-del'] = b => { const c = b.closest('.sh-c'); c?.classList.add('out'); setTimeout(() => { SHIST.del(b.dataset.v); sRedraw(); $('#sq')?.focus(); }, reduced() ? 0 : 160); };
ACTIONS['shist-clr'] = () => { const g = $('.sh-g'); g?.classList.add('out'); setTimeout(() => { SHIST.save([]); sRedraw(); $('#sq')?.focus(); }, reduced() ? 0 : 200); };
ACTIONS.sfill = b => { const q = $('#sq'); q.value = b.dataset.v; q.dispatchEvent(new Event('input')); q.focus(); };

/* ================= 事件分发 ================= */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled){ const f = ACTIONS[a.dataset.act]; if (f){ LAST_TRIG = {el:a, t:performance.now()}; e.preventDefault(); e.stopPropagation(); sfx('click'); f(a, e); return; } }
  const g = e.target.closest('[data-go]');
  if (g){ e.preventDefault(); if (g.dataset.go.startsWith('post-') && !CUR.post){ const c = g.closest('.card')?.querySelector('.cv'); UI.from = c ? {id:g.dataset.go.slice(5), rect:c.getBoundingClientRect()} : null; } if (g.dataset.tab) UI.userTab = g.dataset.tab; else if (g.dataset.go.startsWith('user-')) UI.userTab = 'works'; closeSheet(); $('#menu')?.remove(); go(g.dataset.go); return; }
  if (e.target.matches('[data-ovp]')) ACTIONS.pclose();
  if (e.target.matches('[data-ov]')) dismissSheet();
  const m = $('#menu'); if (m && !e.target.closest('#menu')) m.remove(); else if (m && e.target.closest('#menu a')) m.remove();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#srch')) closeSearch(); else if ($('#vlov') || $('#layer .sov')) dismissSheet(); else $('#menu')?.remove(); }
  if ((e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) && !e.target.closest('input,textarea') && !$('#srch')){ e.preventDefault(); openSearch(); }
});

/* ================= 启动 ================= */
/* 中文字库（HarmonyOS Sans SC，未改动的原始字体文件）约 20MB，按传输需要拆成两段，取回后原样拼接再交给浏览器；
   页面先用系统字体显示，字库就绪后整体切换。
   取回的两段存进 Cache Storage，再次访问直接从本地读取，不再重新下载；开启「省流量」的设备不加载，一直用系统字体 */
function loadHarmonySC(){
  if (!window.FontFace || !window.fetch || /^file:/.test(location.protocol)) return;
  if (navigator.connection && navigator.connection.saveData) return;
  const parts = ['fonts/HarmonyOS_Sans_SC.part1.ttf', 'fonts/HarmonyOS_Sans_SC.part2.ttf'];
  const cacheP = window.caches ? caches.open('ctrlz-font-sc-v1').catch(() => null) : Promise.resolve(null);
  const get = u => cacheP.then(c => (c ? c.match(u).catch(() => null) : Promise.resolve(null)).then(hit => {
    if (hit) return hit.arrayBuffer();
    return fetch(u).then(r => { if (!r.ok) throw new Error(u); if (c) c.put(u, r.clone()).catch(() => {}); return r.arrayBuffer(); });
  }));
  Promise.all(parts.map(get))
    .then(bufs => { const all = new Uint8Array(bufs.reduce((a, b) => a + b.byteLength, 0)); let o = 0; bufs.forEach(b => { all.set(new Uint8Array(b), o); o += b.byteLength; });
      const f = new FontFace('HarmonyOS Sans SC', all.buffer, {weight:'40 900', style:'normal'}); return f.load(); })
    .then(f => { document.fonts.add(f); document.documentElement.classList.add('hos'); fitText(); navInk(); })
    .catch(() => {});
}
(function boot(){
  STATE.hist = store.get('hist', null) || [{k:'post', id:'s3', ts:Date.now() - 2*3600e3}, {k:'item', id:'p3', ts:Date.now() - 5*3600e3}, {k:'video', id:'s2', ts:Date.now() - 26*3600e3}, {k:'post', id:'s8', ts:Date.now() - 30*3600e3}];
  ACC.boot();
  Object.assign(STATE.settings, store.get('settings', {})); applySettings(); applyTheme(); STATE.seller = !!store.get('seller', false);
  setRole(store.get('role', 'user'), true);
  render(); msgBadge(); setTimeout(navInk, 300); (window.requestIdleCallback || setTimeout)(loadHarmonySC);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { COVERS.clear(); if (!CUR.post) { const {r, arg} = parseHash(); renderBase(r, arg, true); } });
})();
</script>
