wrapAct('u-list', (orig, b) => LIVE.u.has(b.dataset.id) ? liveRelSheet(b.dataset.id, b.dataset.v) : orig(b));
/* 登录：只开放手机号和微信；验证码由后端发和校验 */
wrapAct('au-via', (orig, b, e) => { if (b.dataset.v !== 'phone'){ toast('邮箱登录暂未开放，请用手机号', 'blue'); return; } orig(b, e); });
wrapAct('au-quick', () => toast('请用手机号登录', 'blue'));
wrapAct('au-3p', async (orig, b) => {
  if (b.dataset.v !== 'wx'){ toast('Apple 登录暂未开放', 'blue'); return; }
  try { const scene = /MicroMessenger/i.test(navigator.userAgent) ? 'mp' : 'web';
    const r = await API.req('GET', `/auth/wechat/authorize?scene=${scene}&redirect=${encodeURIComponent(location.origin + location.pathname + location.hash)}`); location.href = r.url; }
  catch(err){ apiFail(err); }
});
{ const send0 = auSendCode, verify0 = auVerify, create0 = auCreate;
  auSendCode = function(){
    if (!API.on()) return send0();
    AUTH.left = 60; clearInterval(AUTH.timer); AUTH.timer = setInterval(() => { AUTH.left--; const r = $('#auRs'); if (r) r.innerHTML = auRs(); if (AUTH.left <= 0) clearInterval(AUTH.timer); }, 1000);
    API.req('POST', '/auth/sms/send', {phone:AUTH.phone}).then(r => { if (r.devCode) setTimeout(() => smsShow(r.devCode), 400); })   // 开发环境后端会把验证码带回来，像短信一样从顶部滑下
      .catch(err => { clearInterval(AUTH.timer); AUTH.left = 0; const r = $('#auRs'); if (r) r.innerHTML = `<span class="bad">${esc(err.message)}</span>`; });
  };
  auVerify = function(){
    if (!API.on()) return verify0();
    if (AUTH.busy) return; AUTH.busy = true; const o = $('#auOtp'); o.classList.add('ld'); $('#auC').blur();
    API.req('POST', '/auth/sms/login', {phone:AUTH.phone, code:AUTH.code}).then(r => {
      AUTH.busy = false; smsHide(); clearInterval(AUTH.timer); o.classList.remove('ld'); o.classList.add('ok');
      API.setTok({access:r.accessToken, refresh:r.refreshToken}); apiUser(r.user);
      let a = ACC.list.find(x => x.id === r.user.id); if (!a){ a = {id:r.user.id}; ACC.list.push(a); } Object.assign(a, {name:r.user.name, phone:AUTH.phone}); ACC.save();
      setTimeout(() => { if (r.isNew){ LIVE.pendingId = r.user.id; AUTH.prof = {name:'', c:USERS[r.user.id].c, tags:new Set(), fol:new Set(), phone:AUTH.phone, email:''}; AUTH.step = 'prof'; auRender(); } else { auFinish(r.user.id, 'back'); liveAfterLogin(); } }, 380);
    }).catch(err => {
      AUTH.busy = false; if (!$('#auOtp')) return; o.classList.remove('ld'); o.classList.add('err'); auShake(o); $('#auRs').innerHTML = `<span class="bad">${esc(err.message)}</span>`;
      setTimeout(() => { o.classList.remove('err'); AUTH.code = ''; const C = $('#auC'); if (C){ C.value = ''; C.dispatchEvent(new Event('input')); C.focus(); } }, 1100);
    });
  };
  /* 新用户建档：名字和颜色存到后端；推荐关注里的示例用户在真实后端里不存在，跳过 */
  auCreate = function(){
    if (!API.on() || !LIVE.pendingId) return create0();
    const id = LIVE.pendingId, p = AUTH.prof, name = (p.name || '').trim(); LIVE.pendingId = null;
    if (name){ USERS[id].name = name; USERS[id].ini = nameIni(name); }
    USERS[id].c = p.c; setTimeout(liveAfterLogin, 0);
    if (name) API.req('PATCH', '/me', {name}).catch(apiFail);
    return id;
  };
}
async function liveAfterLogin(){ try { liveMe(await API.req('GET', '/me')); await liveFeed(); await liveMeExtras(); } catch(e){ apiFail(e); } rerender(); msgBadge(); }

/* 别人的主页、帖子评论：第一次打开时从后端拉 */
{ const userRoute0 = ROUTES.user;
  ROUTES.user = id => {
    if (API.on() && id && id !== ME && !LIVE.prof[id]){
      LIVE.prof[id] = 'loading';
      Promise.all([API.req('GET', `/users/${id}`), API.req('GET', `/posts?author=${encodeURIComponent(id)}&limit=50`)]).then(([u, ps]) => {
        apiUser(u, {fans:u.followers, follow:u.following}); u.isFollowing ? STATE.follows.add(u.id) : STATE.follows.delete(u.id);
        ps.items.forEach(p => { const np = apiPost(p); if (!POSTS.some(x => x.id === np.id)) POSTS.push(np); });
        LIVE.prof[id] = 'ok'; rerender();
      }).catch(e => { LIVE.prof[id] = 'missing'; if (e.status !== 404) apiFail(e); rerender(); });
      return `<div class="wrap msub"><div class="empty miss"><div class="x">···</div><span>正在加载</span></div></div>`;
    }
    if (API.on() && LIVE.prof[id] === 'loading') return `<div class="wrap msub"><div class="empty miss"><div class="x">···</div><span>正在加载</span></div></div>`;
    return userRoute0(id);
  };
  const open0 = openPost;
  openPost = function(id){
    open0(id);
    if (!API.on() || !POST(id)?.live || LIVE.cmts[id]) return;
    LIVE.cmts[id] = true;
    API.req('GET', `/posts/${id}/comments?limit=50`).then(r => { COMMENTS[id] = r.items.map(apiCmt); UI.newCmts[id] = []; if (CUR.post === id) renderPost(id); }).catch(e => { LIVE.cmts[id] = false; apiFail(e); });
  };
}

/* 设置里切换数据来源（原型阶段用；正式上线后只连后端） */
ACTIONS['api-set'] = () => sheet(`<h3>连接后端</h3><p class="mut" style="font-size:13.5px;margin-top:-6px">填 ctrlz-server 的地址。后端的 CORS_ORIGINS 里要包含当前网站地址（${esc(location.origin)}）。</p>
  <input class="inp" id="apiU" placeholder="https://api.example.com" value="${esc(API.base)}" autocomplete="off" inputmode="url"><button class="pill lg" data-act="api-go">连接</button>`);
ACTIONS['api-go'] = async () => { const u = $('#apiU').value.trim().replace(/\/+$/, ''); if (!/^https?:\/\/\S+$/.test(u)){ fxPop($('#apiU'), 'fx-shake', 300); return; }
  try { const r = await fetch(u + '/health'); if (!r.ok) throw 0; } catch(e){ toast('连不上这个地址，检查一下地址和后端的 CORS 设置', 'orange', 'x'); return; }
  store.set('apiBase', u); store.set('apiTok', null); location.reload(); };
ACTIONS['api-off'] = () => { store.set('apiBase', ''); store.set('apiTok', null); location.reload(); };
const apiBox = () => `<div class="box"><div class="box-h"><h3>原型 · 数据来源</h3><span class="tag ${API.on() ? 'c-green' : 'k'}">${API.on() ? '真实后端' : '本地模拟'}</span></div><div class="box-b set-l">
  ${API.on() ? `<div class="set-r"><span>后端地址<span class="mut2" style="display:block;font-size:12.5px;word-break:break-all">${esc(API.base)}</span></span><button class="pill sm lt" data-act="api-off">切回本地模拟</button></div>
    <p class="mut2" style="font-size:12.5px;margin:6px 0 0">已接通：登录、信息流、帖子、评论、点赞、关注、拉黑、官方通知、设置。商城、私信、合作、工作室、管理后台仍是本地模拟。</p>`
  : `<div class="set-r"><span>现在用的是浏览器里的示例数据</span><button class="pill sm" data-act="api-set">连接后端</button></div>`}</div></div>`;

(function boot(){
  STATE.hist = store.get('hist', null) || [{k:'post', id:'s3', ts:Date.now() - 2*3600e3}, {k:'item', id:'p3', ts:Date.now() - 5*3600e3}, {k:'video', id:'s2', ts:Date.now() - 26*3600e3}, {k:'post', id:'s8', ts:Date.now() - 30*3600e3}];
  ACC.boot(); delcApply();
  Object.assign(STATE.settings, store.get('settings', {})); applySettings(); applyTheme(); STATE.seller = !!store.get('seller', false);
  setRole(store.get('role', 'user'), true); liveReset();
  render(); if (API.on()) liveBoot(); msgBadge(); setTimeout(navInk, 300); (window.requestIdleCallback || setTimeout)(loadHarmonySC);
  // 缓存加速（Service Worker，见 sw.js）：页面加载完再注册，不和首屏抢资源
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', () => setTimeout(() => navigator.serviceWorker.register('sw.js').catch(() => {}), 1500));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { COVERS.clear(); if (!CUR.post) { const {r, arg} = parseHash(); renderBase(r, arg, true); } });
})();
