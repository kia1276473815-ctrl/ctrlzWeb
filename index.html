/* 正文字体：HarmonyOS Sans（西文随页面直接加载；中文字库较大，由脚本在页面可用后加载，加载完成前用系统字体） */
@font-face{font-family:"HarmonyOS Sans";src:url("fonts/HarmonyOS_Sans.ttf") format("truetype");font-weight:40 900;font-style:normal;font-display:swap}

/* 概念：一本每天重印的孔版（Risograph）杂志。
   纸面 + 荧光粉 / 钴蓝 / 柠檬黄 三色油墨叠印；平面几何、颗粒、错版。
   分类即颜色：采样=粉，预设=蓝，TD=橙，视觉=黄。
   字体：展示字体 Archivo 只用于标题、海报、封面等视觉设计；其余一律正文字体。
   深色模式：页面变暗，作品与试听台仍是“印在纸上”的实物（--sheet），文字压在色块上统一用 --on。 */
:root{
  color-scheme: light;
  --paper:#F2F2EE; --card:#FFFFFF; --ink:#141418; --ink-2:#53535C; --ink-3:#8E8F98; --rule:#DEDED8; --rule-2:#C8C8C1;
  --pink:#FF4FA7; --blue:#2E5BFF; --yellow:#FFE14A; --orange:#FF6B2C; --green:#10B26A; --violet:#7B61FF;
  --pink-t:#FFE0EF; --blue-t:#DFE6FF; --yellow-t:#FFF5C4; --orange-t:#FFE4D7; --green-t:#D6F4E5; --violet-t:#E9E3FF;
  --f-x:"Archivo","HarmonyOS Sans SC","PingFang SC",sans-serif;
  --on:#141418; --sheet:#F7F6F1;
  --f-b:"HarmonyOS Sans","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --g:clamp(16px,3.2vw,44px);
  --hd:64px;
  --hdy:var(--hd); /* 顶栏当前占用的高度：往下滑收起时变 0，贴在顶栏下面的元素用它定位 */
  --ease:cubic-bezier(.2,.9,.1,1);
  --spring:cubic-bezier(.3,1.5,.5,1);
  --grain:none;
}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--f-b);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:var(--yellow);color:var(--ink)}
img{display:block}
.num{font-variant-numeric:tabular-nums}
.x{font-family:var(--f-x);font-weight:900;font-stretch:125%;letter-spacing:-.025em;line-height:.86;text-transform:uppercase}
.xc{font-family:var(--f-x);font-weight:800;font-stretch:72%;letter-spacing:-.01em;line-height:.9;text-transform:uppercase}
.s{font-family:var(--f-b);font-style:normal;font-weight:500;letter-spacing:0;text-transform:none}
.lab{font:700 11px/1 var(--f-b);font-stretch:110%;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mut{color:var(--ink-2)} .mut2{color:var(--ink-3)}
.grain{position:relative;isolation:isolate}
.grain::after{content:"";position:absolute;inset:0;background-image:var(--grain);background-size:180px;mix-blend-mode:multiply;opacity:.4;pointer-events:none;z-index:1}
.wrap{max-width:1480px;margin:0 auto;padding-inline:var(--g)}
.c-pink{--c:var(--pink);--ct:var(--pink-t)} .c-blue{--c:var(--blue);--ct:var(--blue-t)} .c-yellow{--c:var(--yellow);--ct:var(--yellow-t)}
.c-orange{--c:var(--orange);--ct:var(--orange-t)} .c-green{--c:var(--green);--ct:var(--green-t)} .c-violet{--c:var(--violet);--ct:var(--violet-t)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink));flex:none;display:inline-block}

/* ===== 顶栏 ===== */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--hd);display:flex;align-items:center;gap:clamp(12px,2vw,28px);padding-inline:var(--g);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid transparent;transition:border-color .2s,transform .3s var(--ease)}
.hd.sc{border-bottom-color:var(--rule)}
/* 往下滑收起顶栏、往上滑再浮出（所有尺寸）；贴在顶栏下面的页签条、侧栏一起上移 */
html.hd-off{--hdy:0px}
@media (max-width:760px){ html.hd-off .hd{transform:translateY(calc(-100% - env(safe-area-inset-top,0px) - 2px))} }
.htabs{transition:top .3s var(--ease),transform .3s var(--ease)}
html.hd-off .htabs{transform:translateY(calc(-100% - env(safe-area-inset-top,0px) - 8px))}
.sticky-f,.info,.snav,.mtabs,.m-main,.toasts,.stk-hd{transition:top .3s var(--ease)}
.wm{font:900 26px/1 var(--f-x);font-stretch:125%;letter-spacing:-.04em;display:flex;align-items:baseline;white-space:nowrap}
.wm span{color:var(--pink);margin-left:.18em;position:relative}
.wm span::before{content:"Z";position:absolute;left:2px;top:2px;color:var(--blue);mix-blend-mode:multiply;z-index:-1}
.nav{display:flex;gap:4px;flex:1}
.nav a{position:relative;padding:8px 14px;border-radius:999px;font-weight:500;font-size:15px;color:var(--ink-2);transition:background .2s,color .2s}
.nav a:hover{color:var(--ink);background:rgba(20,20,24,.05)}
.nav a.on{color:var(--paper);background:var(--ink)}
.hd-r{display:flex;align-items:center;gap:10px}
.hd[data-s=none] .sbtn{display:none} /* 「我」板块不提供搜索 */
/* 无顶栏设计：不显示 logo。
   手机：一级页面（首页 / 商城 / 私信 / 我）没有顶栏，菜单、搜索放在各页面自己的第一行；子页面保留「返回 + 页名 + 搜索」的顶栏
   平板 / 电脑：顶栏变成左侧边栏（见文末「左侧边栏」），页面里的菜单、搜索入口不重复显示 */
.hd .wm{display:none}
.hd-r{margin-left:auto}
.hd-menu{flex:none;margin-left:-8px}
@media (max-width:760px){ .hd .hd-menu{display:none} html.no-hd .hd{display:none} html.no-hd{--hdy:0px} html.no-hd #app{padding-top:env(safe-area-inset-top,0px)} }
@media (min-width:761px){ .mh-top [data-act="me-menu"],.pg-only{display:none !important} }
.sbtn{display:flex;align-items:center;gap:10px;height:40px;padding:0 8px 0 16px;border-radius:999px;background:var(--card);border:1px solid var(--rule);color:var(--ink-3);font-size:14px;min-width:220px;transition:border-color .2s}
.sbtn:hover{border-color:var(--rule-2);color:var(--ink-2)}
.sbtn svg{width:16px;height:16px}
kbd{font:600 11px/1 var(--f-b);padding:5px 7px;border-radius:6px;background:var(--paper);border:1px solid var(--rule);color:var(--ink-2);margin-left:auto}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 13px/1 var(--f-b);font-stretch:110%;color:var(--ink);background:var(--c,var(--yellow));overflow:hidden;position:relative}
.av.sm{width:24px;height:24px;font-size:9px}
.av.md{width:44px;height:44px;font-size:15px}
.av.lg{width:112px;height:112px;font-size:38px}
.av.xl{width:min(34vw,180px);height:min(34vw,180px);font-size:min(11vw,60px)}
.av.on-dark{box-shadow:0 0 0 2px var(--paper)}


/* 返回键：统一在左上角 */
.hd-back{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1px var(--rule);display:grid;place-items:center;flex:none;color:var(--ink);transition:transform .2s var(--spring),box-shadow .2s}
.hd-back svg{width:18px;height:18px;transition:transform .2s var(--ease)}
.hd-back:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.hd-back:hover svg{transform:translateX(-3px)}
.hd-back:active{transform:scale(.92)}
.hd-back[hidden]{display:none}
.hd.has-back{gap:12px}
.pback{position:absolute;top:14px;left:14px;z-index:5;width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 2px 10px rgba(20,20,24,.12);transition:transform .2s var(--spring)}
.pback svg{width:18px;height:18px;transition:transform .2s var(--ease)}
.pback:hover svg{transform:translateX(-3px)}
.pback:active{transform:scale(.92)}
.post .media > .grain{padding-top:72px!important}
@media (max-width:760px){ .hd.has-back .wm{margin-right:auto} .pback{top:calc(12px + env(safe-area-inset-top,0px));left:12px} }

/* ===== 按钮 / 标签 ===== */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font:600 14px/1 var(--f-b);background:var(--ink);color:var(--paper);white-space:nowrap;transition:transform .15s var(--spring),background .2s,color .2s,box-shadow .2s;user-select:none;-webkit-user-select:none}
.pill:hover{box-shadow:0 0 0 3px rgba(20,20,24,.12)}
.pill:active{transform:scale(.95)}
.pill svg{width:16px;height:16px;flex:none}
.pill.ol{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.pill.ol:hover{background:var(--ink);color:var(--paper)}
.pill.lt{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.pill.lt:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.pill.pk{background:var(--pink);color:var(--ink)}
.pill.cc{background:var(--c);color:var(--ink)}
.pill.sm{height:32px;padding:0 13px;font-size:13px}
.pill.lg{height:54px;padding:0 26px;font-size:16px}
.pill.ic{width:40px;padding:0}
.pill.sm.ic{width:32px}
.pill.on{background:var(--ink);color:var(--paper)}
.pill[disabled]{opacity:.35;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink-2);background:var(--card);box-shadow:inset 0 0 0 1px var(--rule);white-space:nowrap;transition:all .18s;flex:none}
.chip:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink-3)}
.chip.on{background:var(--ink);color:var(--paper);box-shadow:none}
.chip .n{font:700 11px/1 var(--f-b);opacity:.55}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font:700 11px/1 var(--f-b);font-stretch:110%;letter-spacing:.04em;text-transform:uppercase;background:var(--c,var(--ink));color:var(--ink);white-space:nowrap}
.tag.k{background:var(--ink);color:var(--paper)}
.tag.ln{background:transparent;box-shadow:inset 0 0 0 1.2px currentColor}

/* ===== 页面 ===== */
main{min-height:80vh}
.page{padding-bottom:120px}
.page.in{animation:pin .24s ease-out}
@keyframes pin{from{opacity:0}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-block:clamp(28px,5vw,64px) 22px}
.ph h1{font-size:clamp(56px,11vw,168px)}
.ph h1 .s{font-size:.5em;text-transform:none;letter-spacing:0;margin-left:.1em;color:var(--ink-2)}
.ph .sub{font-size:16px;color:var(--ink-2);max-width:44ch}
.sec{margin-top:clamp(56px,8vw,112px)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:20px}
.sh h2{font-size:clamp(34px,5vw,64px)}
.sh h2 .s{text-transform:none;font-size:.55em;color:var(--ink-2);margin-left:.15em;letter-spacing:0}
.more{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:1.5px solid var(--ink);padding-bottom:2px;transition:gap .2s}
.more:hover{gap:10px}
.more svg{width:14px;height:14px}
.rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.sticky-f{position:sticky;top:calc(var(--hdy) + env(safe-area-inset-top,0px));z-index:20;background:var(--paper);padding-block:10px;margin-inline:calc(var(--g) * -1);padding-inline:var(--g)}

/* ===== 首页海报 ===== */
.hero{position:relative;height:min(82vh,760px);min-height:520px;overflow:hidden;background:#F7F6F1;cursor:crosshair;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-wm{position:absolute;left:var(--g);bottom:clamp(20px,4vw,48px);pointer-events:none;font-size:clamp(84px,19vw,300px);mix-blend-mode:multiply;color:var(--ink)}
.hero-wm span{color:var(--pink)}
.hero-top{position:absolute;top:22px;left:var(--g);right:var(--g);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none}
.hero-top .s{font-size:clamp(22px,2.6vw,34px);line-height:1.05;max-width:13ch}
.hero-top .lab{color:var(--ink);text-align:right;line-height:1.6}
.sticker{position:absolute;right:var(--g);bottom:clamp(24px,5vw,60px);width:clamp(112px,13vw,150px);aspect-ratio:1;border-radius:50%;background:var(--pink);display:grid;place-items:center;z-index:3;transition:transform .25s var(--spring),background .3s}
.sticker:hover{transform:scale(1.06) rotate(-4deg)}
.sticker:active{transform:scale(.94)}
.sticker svg.ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 14s linear infinite}
.sticker svg.ring text{font:700 10.5px var(--f-b);font-stretch:115%;letter-spacing:.14em;fill:var(--ink);text-transform:uppercase}
.sticker .core{width:42%;aspect-ratio:1;border-radius:50%;background:var(--ink);display:grid;place-items:center;color:var(--paper)}
.sticker .core svg{width:36%;height:36%}
.sticker.on{background:var(--yellow)}
@keyframes spin{to{transform:rotate(360deg)}}
.inks{position:absolute;left:var(--g);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:3}
.ink{width:30px;height:30px;border-radius:50%;position:relative;transition:transform .2s var(--spring)}
.ink i{position:absolute;width:20px;height:20px;border-radius:50%;mix-blend-mode:multiply}
.ink i:first-child{left:0;top:0}.ink i:last-child{right:0;bottom:0}
.ink:hover{transform:scale(1.15)}
.ink.on{transform:scale(1.15)}
.ink.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink)}
.band{background:var(--blue);color:var(--paper);overflow:hidden;white-space:nowrap}
.band-in{display:inline-flex;gap:28px;padding:14px 0;animation:tick 38s linear infinite;font:800 clamp(18px,2.2vw,28px)/1 var(--f-b);font-stretch:120%;letter-spacing:-.01em;text-transform:uppercase}
.band-in i{font-style:normal;color:var(--yellow)}
@keyframes tick{to{transform:translateX(-50%)}}


/* ===== 首页海报位 ===== */
.bn{position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:clamp(460px,80vh,760px);height:clamp(460px,80svh,760px);padding:0 var(--g) 20px;overflow:hidden;background:#F7F6F1;user-select:none;-webkit-user-select:none;touch-action:pan-y;outline:none}
.bn canvas{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform}
@media (pointer:fine){ .bn.cur-on{cursor:none} .bn a,.bn button{cursor:pointer} }
.bcur{position:absolute;left:0;top:0;z-index:4;pointer-events:none;width:0;height:0}
.bcur::before{content:"";position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink);transition:all .22s var(--spring)}
.bcur svg{position:absolute;left:-11px;top:-11px;width:22px;height:22px;color:var(--paper);opacity:0;transform:scale(.4);transition:all .22s var(--spring);z-index:1}
.bcur[data-k="sound"]::before,.bcur[data-k="strum"]::before{left:-26px;top:-26px;width:52px;height:52px;background:var(--ink);box-shadow:none}
.bcur[data-k="play"]::before,.bcur[data-k="pause"]::before{left:-44px;top:-44px;width:88px;height:88px;box-shadow:inset 0 0 0 3px var(--ink)}
.bcur[data-k="play"] svg,.bcur[data-k="pause"] svg{left:-13px;top:-13px;width:26px;height:26px}
.bcur[data-k="sound"] svg,.bcur[data-k="strum"] svg{opacity:1;transform:none}
.bcur[data-k="stamp"]::before{opacity:0}
.bn:not(.cur-on) .bcur{opacity:0}
@media (pointer:coarse){ .bcur{display:none} }
.bn-top{position:absolute;top:22px;right:var(--g);z-index:3;pointer-events:none}
.bn-top .lab{color:var(--ink)}
.bn-txt{position:relative;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0;max-width:46%}
.bn-txt .lab{color:var(--ink)}
.bn-txt h2{font-size:clamp(56px,11.5vw,190px);mix-blend-mode:multiply;white-space:nowrap;max-width:100%}
.bn-txt p{font-size:clamp(15px,1.4vw,19px);font-weight:600;max-width:30ch}
.bn-txt .row{pointer-events:auto;margin-top:6px}
.bn-txt .pill span{margin-left:2px}
.bn-txt.anim .bt{animation:btin .55s var(--ease) both;animation-delay:calc(var(--d) * 55ms + 140ms)}
@keyframes btin{from{opacity:0;transform:translateX(var(--dx))}}
.bn-ctl{position:relative;z-index:3;display:flex;align-items:center;gap:14px;margin-top:clamp(14px,3vh,30px)}
.bn-seg{display:flex;gap:6px;flex:1;max-width:420px}
.bn-seg button{flex:1;height:22px;display:flex;align-items:center}
.bn-seg button i{display:block;width:100%;height:4px;border-radius:2px;background:rgba(20,20,24,.16);position:relative;overflow:hidden;transition:height .2s}
.bn-seg button i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0) * 100%);background:var(--ink);border-radius:2px}
.bn-seg button:hover i{height:8px}
.bn.paused .bn-seg button.on i::after{background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 9px)}
.bn-cnt{margin-left:auto;font:600 13px/1 var(--f-b);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bn-cnt b{color:var(--ink);font-weight:900}
.bn-a{width:48px;height:48px;border-radius:50%;background:var(--paper);display:grid;place-items:center;transition:transform .2s var(--spring),background .2s,color .2s}
.bn-a svg{width:18px;height:18px}
.bn-a:first-of-type svg{transform:rotate(180deg)}
.bn-a:hover{background:var(--ink);color:var(--paper)}
.bn-a[data-act="bn-prev"]:active{transform:translateX(-4px)}
.bn-a[data-act="bn-next"]:active{transform:translateX(4px)}
.catband{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.catband a{position:relative;display:flex;align-items:center;gap:14px;padding:18px var(--g) 18px clamp(16px,2vw,28px);background:var(--c);overflow:hidden;min-width:0}
.catband .g{width:34px;height:34px;flex:none;color:var(--ink);position:relative;transition:transform .3s var(--spring)}
.catband .g svg{width:100%;height:100%}
.catband .g::after{content:"";position:absolute;inset:0;background:inherit}
.catband a:hover .g{transform:translate(-3px,-3px)}
.catband .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.catband b{font:900 clamp(14px,1.4vw,20px)/1 var(--f-x);font-stretch:115%;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catband .t span{font-size:12.5px;font-weight:600}
.catband i{margin-left:auto;font:900 13px/1 var(--f-b);font-style:normal;color:var(--ink);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--paper);transition:transform .25s var(--spring)}
.catband a:hover i{transform:scale(1.15)}
.c-blue.catband a,.catband a.c-blue{color:var(--paper)}
.catband a.c-blue .g{color:var(--paper)}
/* 导航墨块：随选中项滑动 */
.nav{position:relative}
.nav a{z-index:1}
.nav a.on{background:transparent}
.nav-ink{position:absolute;top:0;left:0;border-radius:999px;background:var(--ink);transition:left .38s var(--spring),width .38s var(--spring),top .38s var(--spring),height .38s var(--spring),opacity .2s;pointer-events:none;opacity:0}
/* 滑杆数值气泡 */
.rng b::after,.tl b::after{content:attr(data-v);position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%) translateY(4px);background:var(--ink);color:var(--paper);font:800 11px/1 var(--f-b);padding:5px 7px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none}
.rng.drag b::after,.tl.drag b::after{opacity:1;transform:translateX(-50%)}
/* pad 波纹：从按下的位置扩散 */
.rip{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--c);pointer-events:none;animation:rip .55s cubic-bezier(.2,.8,.2,1) forwards;z-index:1}
@keyframes rip{from{transform:scale(1);opacity:.9}to{transform:scale(22);opacity:0}}
/* 新评论：落在哪里一眼可见 */
.cmt.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{0%{background:var(--yellow)}100%{background:transparent}}
/* 计数变化 */
.bump{display:inline-block;animation:bump .3s var(--ease)}
@keyframes bump{from{transform:translateY(-70%);opacity:0}}
/* 播放条：真实电平 + 循环位置 */
.player .eq i{animation:none;height:20%;transition:height .08s}
.pring{border-radius:50%;padding:3px;background:conic-gradient(var(--c) calc(var(--p,0) * 1turn),rgba(255,255,255,.18) 0)}
.av .bdg{position:absolute;right:-3px;top:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--paper);font:800 10px/18px var(--f-b);text-align:center;padding:0 4px;box-shadow:0 0 0 2px var(--paper)}
.av{overflow:visible}
.fly{position:fixed;z-index:140;border-radius:12px;object-fit:cover;pointer-events:none;box-shadow:0 10px 30px rgba(20,20,24,.25)}
@media (max-width:760px){
  .bn-txt h2{font-size:clamp(48px,16vw,96px)}
  .bn-ctl{gap:8px}
  .bn-a{width:40px;height:40px}
  .bn-cnt{display:none}
  .bn-top{display:none}
  .catband{grid-template-columns:repeat(2,minmax(0,1fr))}
  .catband a{padding:14px 16px;gap:10px}
  .catband .g{width:26px;height:26px}
}


/* 播放中的封面 */
.cv canvas.live,.icv canvas.live{position:absolute;inset:0;width:100%;height:100%;z-index:2;display:block;animation:fade .25s}
.slv .cv .pv,.slv .cv .own{z-index:3}
.ihead{display:grid;grid-template-columns:clamp(84px,9vw,116px) minmax(0,1fr);gap:16px;align-items:center}
.icv{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--c)}
.icv img{width:100%;height:100%;object-fit:cover}
.icv .pv{position:absolute;right:6px;bottom:6px;z-index:3}
/* 上架：封面模板与配色 */
.cvp{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.cvp button{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;transition:transform .2s var(--spring),box-shadow .15s}
.cvp button img{width:100%;height:100%;object-fit:cover}
.cvp button span{position:absolute;left:6px;bottom:6px;font:700 11px/1 var(--f-b);background:var(--paper);padding:4px 7px;border-radius:999px}
.cvp button:hover{transform:translateY(-2px)}
.cvp button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink)}
.palp{display:flex;gap:6px;flex-wrap:wrap}
.palp button{display:flex;align-items:center;height:38px;padding:0 14px 0 8px;border-radius:999px;background:var(--paper);font-size:13px;font-weight:600;gap:0;transition:background .15s,color .15s}
.palp button i{width:20px;height:20px;border-radius:50%;mix-blend-mode:multiply;flex:none}
.palp button i + i{margin-left:-8px;margin-right:8px}
.palp button.on{box-shadow:inset 0 0 0 2px var(--ink);background:var(--card)}
.sellrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:14px;background:var(--yellow-t);transition:background .2s}
.sellrow:hover{background:var(--yellow)}
.sellrow .g{width:40px;height:40px;color:var(--pink)}
.sellrow .g svg{width:100%;height:100%}
.sellrow b{display:block;font-size:15px}
.sellrow span span{font-size:12.5px;color:var(--ink-2)}
.sellrow > svg{width:18px;height:18px}
.invf{display:flex;gap:8px}
.invf .inp{height:60px;font-size:clamp(18px,4.6vw,22px);letter-spacing:.04em;min-width:0}
.invf .pill{height:60px;flex:none}
.roles{grid-template-columns:repeat(3,1fr)!important}

/* ===== 帖子卡 ===== */
.mason{column-count:4;column-gap:18px}
.mason > *{break-inside:avoid;margin-bottom:26px}
.card{display:block;cursor:pointer}
.card .cv{position:relative;overflow:hidden;border-radius:14px;background:var(--c,var(--pink))}
.card .cv > img,.card .cv > canvas{width:100%;height:auto;display:block;transition:transform .35s var(--ease)}

.card .bd{padding:12px 2px 0;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:15.5px;line-height:1.42;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2);min-width:0}
.card .who{display:flex;align-items:center;gap:7px;min-width:0}
.card .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .lk{display:flex;align-items:center;gap:4px;flex:none;font-variant-numeric:tabular-nums}
.card .lk svg{width:14px;height:14px}
.card .lk.on{color:var(--pink)}
.cv .kind{position:absolute;left:10px;top:10px;z-index:2}
.cv .plat{position:absolute;left:10px;bottom:10px;z-index:2;font:700 10.5px/1 var(--f-b);letter-spacing:.06em;padding:5px 8px;border-radius:999px;background:var(--paper);color:var(--ink)}
.cv .dur{position:absolute;right:10px;bottom:10px;z-index:2;font:600 11px/1 var(--f-b);padding:5px 8px;border-radius:999px;background:rgba(20,20,24,.75);color:var(--paper);font-variant-numeric:tabular-nums}
.pbtn{width:54px;height:54px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;transition:transform .2s var(--spring),background .2s;flex:none}
.pbtn svg{width:18px;height:18px}
.pbtn:hover{transform:scale(1.08)}
.pbtn:active{transform:scale(.92)}
.pbtn.on{background:var(--ink);color:var(--paper)}
.pbtn.sm{width:40px;height:40px}
.pbtn.sm svg{width:14px;height:14px}
.cv .mid{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
/* 音频卡 */
.acv{padding:16px;display:flex;flex-direction:column;gap:12px;aspect-ratio:1/1.05;justify-content:space-between}
.acv canvas{width:100%;height:42%;display:block}
.acv .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.acv .t{font:900 clamp(28px,3vw,40px)/.85 var(--f-x);font-stretch:125%;text-transform:uppercase;letter-spacing:-.03em;mix-blend-mode:multiply}
/* 提问卡 */
.qcv{padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;min-height:220px}
.qcv .q{font:900 84px/.8 var(--f-x);font-stretch:125%;mix-blend-mode:multiply}
.qcv p{font-weight:700;font-size:17px;line-height:1.45}
.qcv .st{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.att{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--rule);font-size:12.5px;min-width:0;transition:box-shadow .2s}
.att:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.att span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.att b{font:800 12.5px/1 var(--f-b);flex:none}
/* 盖章 */
.stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 14px;border:3px solid currentColor;outline:1.5px solid currentColor;outline-offset:3px;color:var(--sc,var(--ink));transform:rotate(-8deg);font:900 15px/1 var(--f-b);font-stretch:120%;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;mix-blend-mode:multiply;-webkit-mask:var(--stamp) 0 0/140px;mask:var(--stamp) 0 0/140px}
.stamp small{font:700 12px/1.2 var(--f-b);letter-spacing:.2em;margin-top:4px}
.stamp.big{font-size:28px;padding:12px 22px;border-width:4px}
.stamp.big small{font-size:15px}
.stamp.pop{animation:stamp .45s var(--spring)}
@keyframes stamp{0%{transform:rotate(-20deg) scale(2.2);opacity:0}60%{opacity:1}100%{transform:rotate(-8deg) scale(1)}}

/* ===== 帖子浮层 ===== */
.ov{position:fixed;inset:0;z-index:80;background:rgba(20,20,24,.42);display:grid;place-items:center;padding:24px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.post{width:min(1200px,100%);height:min(880px,calc(100vh - 48px));background:var(--card);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(360px,1fr);animation:rise .35s var(--ease);position:relative}
@keyframes rise{from{transform:translateY(30px) scale(.98);opacity:0}}
.post .media{background:var(--c,var(--paper));position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}
.post .media > img{width:100%;height:100%;object-fit:cover}
.post .side{display:flex;flex-direction:column;min-height:0}
.post .top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--rule)}
.post .scroll{flex:1;overflow-y:auto;padding:20px 20px 10px;overscroll-behavior:contain}
.post h1{font-size:23px;line-height:1.38;font-weight:900}
.post .body{display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.85;color:color-mix(in srgb,var(--ink) 86%,var(--card));margin-top:14px}
.post pre,.code{font:13px/1.7 ui-monospace,"SFMono-Regular",Menlo,monospace;background:var(--paper);padding:12px 14px;border-radius:10px;overflow-x:auto;margin:0;color:var(--ink)}
.post .foot{position:relative;border-top:1px solid var(--rule);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--card)}
.post .foot > :not(textarea){margin-bottom:5px}
.post .foot textarea{flex:1;min-width:0;height:42px;border-radius:21px;border:0;background:var(--paper);padding:10px 16px;outline:0}
.post .foot textarea:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
/* 输入框：多行自动长高（最多 5 行再滚动） */
.post .foot textarea,.cv-f textarea{display:block;resize:none;font:inherit;line-height:22px;max-height:134px;overflow-y:hidden;color:inherit}
/* 聚焦时旁边的图标（.cdock）被挤走：占位宽度收成 0，图标变成在输入栏上沿滚动的小球（dockOn） */
.cdock{display:flex;align-items:center;gap:inherit;flex:none;overflow:visible;transition:width .3s var(--ease),margin .3s var(--ease),opacity .2s}
.cdock.dk-hide{opacity:0;pointer-events:none}
.cdock .dk-fl{position:absolute;left:0;top:0;margin:0;z-index:3;will-change:transform;box-shadow:0 5px 12px -6px rgba(20,20,24,.4)}
/* 输入栏上沿长出一条「架子」，小球落在架子上，不挡输入的字也不挡上面的评论 / 消息 */
.post .foot,.cv-f{transition:padding-top .3s var(--ease)}
.post .foot.dk-on{padding-top:52px} .cv-f.dk-on{padding-top:56px}
/* 小球按孔版色上色：喜欢粉 / 收藏蓝 / 更多黄；私信 图片黄 / 分享蓝 */
.dk-fl[data-act="like"]{background:var(--pink-t)} .dk-fl[data-act="fav"],.dk-fl[data-act="cv-pick"]{background:var(--blue-t)} .dk-fl[data-act="more-post"],label.dk-fl{background:var(--yellow-t)}
.x-close{position:absolute;top:14px;right:14px;z-index:5;width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;transition:transform .2s var(--spring)}
.x-close:hover{transform:scale(1.08)}
.x-close svg{width:16px;height:16px}
.cmt{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--rule)}
.cmt .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:3px}
.cmt .h b{font-weight:700}
.cmt .h span{color:var(--ink-3);font-size:12px}
.cmt p{font-size:14.5px;line-height:1.7}
.cmt .code{margin-top:8px;font-size:12px}
.cmt .ctl{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--ink-3)}
.cmt .ctl button:hover{color:var(--ink)}
.ctl button.on,.ctl button.on:hover{color:var(--pink)}
.cmt.best{background:var(--green-t);margin-inline:-20px;padding-inline:20px;border-top-color:transparent}
.used{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.used a{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border-radius:12px;background:var(--paper);transition:background .2s}
.used a:hover{background:var(--ct)}
.used img{width:56px;height:56px;border-radius:8px;object-fit:cover}
.used b{font:800 15px/1 var(--f-b)}
.solve{display:flex;align-items:center;gap:16px;padding:16px;border-radius:14px;background:var(--yellow-t);margin-top:16px;flex-wrap:wrap}
.solve.done{background:var(--green-t)}
.solve p{flex:1;min-width:160px;font-size:13.5px;color:var(--ink-2)}

.navp{position:fixed;top:50%;width:48px;height:48px;margin-top:-24px;border-radius:50%;background:var(--paper);display:grid;place-items:center;z-index:2;transition:transform .2s var(--spring)}
.navp svg{width:18px;height:18px}
.navp.l{left:max(12px,calc(50vw - 660px))} .navp.l svg{transform:rotate(180deg)}
.navp.r{right:max(12px,calc(50vw - 660px))}
.navp:hover{transform:scale(1.1)}
@media (max-width:1340px){.navp{display:none}}

/* 播放键：统一在封面右下角，播放中变成暂停 */
.card .cv .pv,.slv .cv .pv{position:absolute;right:10px;bottom:10px;z-index:3}
.slv .cv .pv{right:12px;bottom:12px}
.card .cv[data-vbox] .dur{top:10px;bottom:auto}
.post .media .pv{position:absolute;right:clamp(14px,2.4vw,28px);bottom:clamp(14px,2.4vw,28px);z-index:3}
.post .media .pv .pbtn{width:76px;height:76px}
.pbtn.on{background:var(--ink);color:var(--paper)}
.cv canvas.vcv{display:block;width:100%}
.gone{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--paper);text-align:center;padding:16px;font-size:13px;color:var(--ink-2)}
.gone .x{font-size:clamp(26px,3vw,40px);color:var(--rule-2)}

/* ===== 商店 ===== */
.cats{display:grid;grid-template-columns:minmax(160px,1.2fr) repeat(6,minmax(140px,1fr));gap:10px;overflow-x:auto;scrollbar-width:none;padding:3px;margin:-3px}
.cats::-webkit-scrollbar{display:none}
.cat{position:relative;border-radius:16px;background:var(--c,var(--ink));color:var(--ink);padding:16px 16px 14px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden;transition:transform .25s var(--spring)}
.cat:hover{transform:translateY(-3px)}
.cat{container-type:inline-size}
.cat .x{font-size:clamp(17px,calc((100cqi - 32px) / 6.3),34px);position:relative;z-index:2;display:flex;align-items:flex-start;white-space:nowrap;min-width:0}
.cat .cn{font-size:13px;font-weight:600;position:relative;z-index:2}
.cat .ct{font:800 max(11px,.4em)/1 var(--f-b);font-stretch:100%;letter-spacing:0;margin:-.02em 0 0 .18em;opacity:.75;font-variant-numeric:tabular-nums}
.cat.all{background:var(--ink);color:var(--paper)}
.cat:not(.on){opacity:.94}
.cat.on{box-shadow:inset 0 0 0 3px var(--ink)}
.cat.all.on{box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 6px var(--paper)}
.cat svg.sh{position:absolute;right:12px;bottom:40px;width:min(100px,50cqi);height:min(100px,50cqi);mix-blend-mode:multiply;opacity:.92;transition:transform .35s var(--spring)}
.cat svg.sh.all{mix-blend-mode:normal;opacity:.22}
.cat:hover svg.sh{transform:rotate(-6deg) translateY(-3px)}
.cat .cn{line-height:1.3;word-break:keep-all}
.cat:not(.all){min-height:184px}   /* 留出插画的位置：标题在上、插画在右侧中间、说明文字在底部整行 */
.grid-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px 18px}
.slv{display:flex;flex-direction:column;gap:12px;cursor:pointer}
.slv .cv{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--c)}
.slv .cv > img,.slv .cv > canvas{width:100%;height:100%;object-fit:cover;transition:transform .35s var(--ease)}

.slv .pv{position:absolute;right:12px;bottom:12px;z-index:3}
.slv .own{position:absolute;left:12px;top:12px;z-index:3}
.slv .bd{display:flex;flex-direction:column;gap:5px}
.slv .en{font:800 13px/1 var(--f-b);font-stretch:110%;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.slv h3{font-size:15.5px;font-weight:700;line-height:1.35}
.slv .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.price{font:900 20px/1 var(--f-b);font-stretch:110%;letter-spacing:-.01em}
.price s{font-weight:500;font-size:13px;color:var(--ink-3);margin-left:6px}
.slv .by{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;min-width:0}
.slv .by span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== 商品页 ===== */
.pp{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start;padding-top:20px}
.crumb{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-3);padding-top:18px}
.crumb a:hover{color:var(--ink)}
.stage{border-radius:22px;background:var(--c);padding:clamp(14px,2vw,22px);position:relative;overflow:hidden}
.stage > *{position:relative;z-index:2}
.stage-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 12px;margin-bottom:14px;position:relative;z-index:2}
.stage-h .x{font-size:clamp(28px,3.4vw,46px);mix-blend-mode:multiply}
.wbox{position:relative;height:clamp(110px,14vw,160px);border-radius:14px;background:var(--paper);overflow:hidden}
.wbox canvas{position:absolute;inset:0;width:100%;height:100%}
.wbox .nm{position:absolute;left:14px;top:12px;font:800 13px/1 var(--f-b);letter-spacing:.02em;z-index:2}
.pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.pad{position:relative;aspect-ratio:1.55;border-radius:12px;background:var(--paper);padding:10px 11px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden;transition:transform .08s,background .25s,color .25s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.pad b{font:800 clamp(11px,1.15vw,14px)/1.1 var(--f-b);font-stretch:105%;text-transform:uppercase;position:relative;z-index:2}
.pad kbd{position:relative;z-index:2;margin-left:0;align-self:flex-end;background:transparent;border-color:rgba(20,20,24,.15);color:var(--ink-3);font-size:10px;padding:3px 5px}
.pad.hit{transform:scale(.94);background:var(--ink);color:var(--paper);transition:transform .05s,background 0s,color 0s}
.pad.hit kbd{color:var(--paper);border-color:rgba(255,255,255,.3)}
.pad.sel:not(.hit){box-shadow:inset 0 0 0 2px var(--ink)}
.stage-f{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:2}
.sl{display:flex;flex-direction:column;gap:7px;min-width:110px;flex:1}
.sl .h{display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.sl .h b{font:800 12px/1 var(--f-b);font-variant-numeric:tabular-nums}
.rng{position:relative;height:28px;touch-action:none;cursor:pointer}
.rng::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:rgba(20,20,24,.16)}
.rng i{position:absolute;left:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--ink);width:calc(var(--v) * 100%)}
.rng b{position:absolute;top:50%;left:calc(var(--v) * 100%);width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--paper);transition:transform .15s var(--spring)}
.rng:hover b,.rng.drag b{transform:scale(1.2)}
.xy{position:relative;aspect-ratio:1.6;border-radius:14px;background:var(--paper);overflow:hidden;touch-action:none;cursor:crosshair}
.xy canvas{position:absolute;inset:0;width:100%;height:100%}
.xy .ax{position:absolute;font:700 10.5px/1 var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);pointer-events:none}
.xy .knob{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 5px var(--paper),0 0 0 6.5px var(--ink);pointer-events:none;transition:transform .15s var(--spring)}
.xy.drag .knob{transform:scale(1.25)}
.syn{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px}
.syn-r{display:flex;flex-direction:column;gap:12px;background:var(--paper);border-radius:14px;padding:14px}
.lcd{font:800 clamp(18px,2vw,24px)/1.05 var(--f-b);font-stretch:110%;text-transform:uppercase;letter-spacing:-.01em}
.prs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.prs::-webkit-scrollbar{display:none}
.prs button{flex:none;height:32px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,.55);font:700 12px/1 var(--f-b);font-stretch:105%;transition:all .18s;white-space:nowrap}
.prs button:hover{background:var(--paper)}
.prs button.on{background:var(--ink);color:var(--paper)}
.kb{display:flex;height:clamp(118px,15vw,150px);position:relative;user-select:none;-webkit-user-select:none;touch-action:none;gap:3px}
.kb .w{flex:1;background:var(--paper);border-radius:0 0 9px 9px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding-bottom:9px;font:700 10px/1 var(--f-b);color:var(--ink-3);transition:background .15s}
.kb kbd{display:none;font:inherit;opacity:.7}
@media (hover:hover) and (pointer:fine){ .kb kbd{display:block} }
.kb .nn{font-style:normal;font-size:11px;letter-spacing:.02em}
/* 八度切换：‹ C4 – C5 › */
.kbh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;margin-bottom:8px;position:relative;z-index:2}
.kbh .oct{display:flex;align-items:center;gap:6px}
.kbh .oct button{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:800 18px/1 var(--f-b);transition:transform .2s var(--spring),opacity .2s}
.kbh .oct button:active{transform:scale(.9)}
.kbh .oct button:disabled{opacity:.3}
.kbh .oct b{min-width:86px;text-align:center;font:800 15px/1 var(--f-b);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.kbh .hint{display:none;font-size:12px;font-weight:600;opacity:.7}
@media (hover:hover) and (pointer:fine){ .kbh .hint{display:block} }
.kb .w.hit{background:var(--ink);color:var(--paper);transition:none}
.kb .b{position:absolute;top:0;width:7.6%;height:60%;background:var(--ink);border-radius:0 0 6px 6px;z-index:2;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:700 9px/1 var(--f-b);color:rgba(255,255,255,.45)}
.kb .b.hit{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.vbox{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#0d0d10;cursor:pointer}
.vbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vbox .split{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--paper);z-index:3;pointer-events:none}
.vbox .split::after{content:"A ⟷ B";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--paper);color:var(--ink);font:800 11px/1 var(--f-b);padding:7px 10px;border-radius:999px;white-space:nowrap}
.vbox .big{position:absolute;inset:0;display:grid;place-items:center;z-index:2;transition:opacity .2s}
.vbox.playing .big{opacity:0}
.tl{position:relative;height:30px;touch-action:none;cursor:pointer;flex:1;min-width:120px}
.tl::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:rgba(20,20,24,.18)}
.tl i{position:absolute;left:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--ink);width:calc(var(--v) * 100%)}
.tl b{position:absolute;top:50%;left:calc(var(--v) * 100%);width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--c)}
.tc{font:800 13px/1 var(--f-b);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:inline-flex;background:rgba(255,255,255,.5);border-radius:999px;padding:3px}
.seg button{height:30px;padding:0 13px;border-radius:999px;font:700 12px/1 var(--f-b);transition:all .18s;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--paper)}
.info{display:flex;flex-direction:column;gap:22px;min-width:0;position:sticky;top:calc(var(--hdy) + 20px)}
.info h1{font-size:clamp(28px,3vw,40px);line-height:1.2;font-weight:900;margin-top:8px}
.info .en{font-size:clamp(18px,1.6vw,22px)}
.buy{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.buy .price{font-size:40px;margin-right:auto}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule);border-radius:14px;overflow:hidden}
.facts div{background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.facts b{font-size:14px;font-weight:600;line-height:1.4}
.facts .wide{grid-column:1/-1}
.lic{display:flex;flex-wrap:wrap;gap:6px}
.lic span{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;background:var(--green-t);color:var(--ink)}   /* 浅色模式浅绿底深字，深色模式深绿底浅字 */
.lic span.no{background:var(--card);box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--pink);text-decoration-thickness:1.5px}
.files{font:12.5px/1.85 ui-monospace,Menlo,monospace;background:var(--card);border-radius:14px;padding:14px 16px;white-space:pre;overflow-x:auto;color:var(--ink-2)}
.seller{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);transition:box-shadow .2s}
.seller:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.buybar{display:none}


.pp{padding-top:clamp(20px,3vw,40px)}
.ihead{margin-bottom:10px}
.icw{position:relative}
.stk{position:absolute;left:-8px;bottom:-13px;z-index:4;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px 0 8px;border-radius:6px;background:var(--c);color:var(--ink);font:800 12.5px/1 var(--f-b);white-space:nowrap;transform:rotate(-5deg);box-shadow:0 2px 0 rgba(20,20,24,.2);transition:transform .2s var(--spring)}
.stk svg{width:12px;height:12px;flex:none}
.stk.c-blue{color:var(--paper)}
.stk:hover{transform:rotate(-2deg) scale(1.06)}

/* ===== 个人主页 ===== */
.prof{position:relative;padding-block:clamp(28px,5vw,64px) 0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(18px,3vw,40px);align-items:end}
.prof h1{font-size:clamp(48px,8vw,120px)}
.prof .bio{font-size:15px;color:var(--ink-2);max-width:52ch;margin-top:12px}
.stats{display:flex;gap:clamp(18px,3vw,36px)}
.stats div{display:flex;flex-direction:column;gap:4px}
.stats b{font:900 clamp(24px,2.6vw,34px)/1 var(--f-b);font-stretch:110%;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--ink-3)}
.utabs{display:flex;gap:6px;margin:clamp(28px,4vw,48px) 0 24px;border-bottom:1px solid var(--rule)}
.utabs button{position:relative;padding:12px 4px;margin-right:22px;font-size:16px;font-weight:600;color:var(--ink-3);display:flex;gap:6px;align-items:baseline}
.utabs button i{font:800 12px/1 var(--f-b);font-style:normal}
.utabs button.on{color:var(--ink)}
.utabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--ink);border-radius:2px}
.shopband{border-radius:18px;background:var(--c);padding:clamp(18px,2.5vw,28px);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.shopband .x{font-size:clamp(30px,4vw,56px);mix-blend-mode:multiply}
.creators{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.crt{border-radius:18px;background:var(--card);padding:18px;display:flex;flex-direction:column;gap:14px;transition:transform .25s var(--spring)}
.crt:hover{transform:translateY(-4px)}
.crt h3{font:900 24px/1 var(--f-b);font-stretch:115%;text-transform:uppercase;letter-spacing:-.02em}
.crt .r{font-size:13px;color:var(--ink-2)}
.crt .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.crt .strip img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}

/* ===== 后台 ===== */
.dash{display:grid;grid-template-columns:200px minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:start}
.snav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(var(--hdy) + 20px)}
.snav button{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:999px;font-size:14.5px;font-weight:500;color:var(--ink-2);text-align:left;transition:all .18s}
.snav button:hover{background:rgba(20,20,24,.05);color:var(--ink)}
.snav button.on{background:var(--ink);color:var(--paper)}
.snav button .n{margin-left:auto;font:800 11px/1 var(--f-b);min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;background:var(--pink);color:var(--ink);padding:0 6px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{border-radius:18px;background:var(--card);padding:18px;display:flex;flex-direction:column;gap:14px;min-height:150px;justify-content:space-between}
.kpi.cc{background:var(--c)}
.kpi b{font:900 clamp(30px,3.2vw,48px)/.9 var(--f-b);font-stretch:110%;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--ink-2)}
.box{border-radius:18px;background:var(--card);margin-top:14px;overflow:hidden}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;flex-wrap:wrap}
.box-h h3{font-size:18px;font-weight:900}
.box-b{padding:0 18px 18px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.t th{font:700 11px/1 var(--f-b);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 18px;border-top:1px solid var(--rule);white-space:nowrap}
.t td{padding:13px 18px;border-top:1px solid var(--rule);vertical-align:middle}
.t td.r,.t th.r{text-align:right}
.t .n{font-variant-numeric:tabular-nums;font-family:var(--f-b);font-weight:600}
.t .neg{color:var(--ink-3)}
.t tfoot td{font-weight:800;border-top:2px solid var(--ink)}
.t tr.dim td{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rule-2)}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:clamp(8px,2vw,20px);height:180px;padding:10px 18px 18px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;max-width:56px;border-radius:8px 8px 3px 3px;background:var(--rule);transition:height .6s var(--ease)}
.bars .b.cur i{background:var(--pink)}
.bars .b span{font-size:12px;color:var(--ink-3)}
.bars .b em{font:800 12px/1 var(--f-b);font-style:normal;font-variant-numeric:tabular-nums}
.up{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.stepper{display:flex;flex-direction:column;gap:12px}
.step{border-radius:18px;background:var(--card);padding:18px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px}
.step > .no{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:900 15px/1 var(--f-b);background:var(--paper)}
.step.ok > .no{background:var(--green);color:var(--paper)}
.step h4{font-size:16px;font-weight:800;margin:8px 0 12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
.fl{display:flex;flex-direction:column;gap:6px}
.fl label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.inp{height:44px;padding:0 14px;border-radius:12px;border:0;background:var(--paper);outline:0;width:100%;transition:box-shadow .15s}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
textarea.inp{height:auto;min-height:90px;padding:12px 14px;resize:vertical;line-height:1.6}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.drop{border-radius:14px;border:2px dashed var(--rule-2);padding:22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--ink-2);font-size:13.5px;cursor:pointer;transition:all .2s}
.drop:hover{border-color:var(--ink);color:var(--ink);background:var(--paper)}
.drop svg{width:24px;height:24px}
.drop.ok{border-style:solid;border-color:var(--green);background:var(--green-t);color:var(--ink)}
.tplp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tplp button{border-radius:14px;padding:12px;background:var(--paper);text-align:left;display:flex;flex-direction:column;gap:10px;transition:all .18s}
.tplp button .ic{height:46px;border-radius:9px;background:var(--c);display:grid;place-items:center}
.tplp button .ic svg{width:60%;height:70%}
.tplp button b{font-size:13.5px}
.tplp button.on{box-shadow:inset 0 0 0 2px var(--ink);background:var(--card)}
.q-card{border-radius:20px;background:var(--card);overflow:hidden;display:grid;grid-template-columns:200px minmax(0,1fr)}
.q-card img{width:100%;height:100%;object-fit:cover;min-height:200px}
.q-card .bd{padding:20px;display:flex;flex-direction:column;gap:12px}
.q-card h3{font-size:22px;font-weight:900;line-height:1.3}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.flag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;background:var(--green-t)}
.flag.w{background:var(--orange-t)}
.qact{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.qact .pill kbd{background:transparent;border-color:currentColor;color:inherit;opacity:.6;margin-left:4px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}   /* 一张卡片展开时，同排的不跟着拉高 */
.li{display:grid;grid-template-columns:88px minmax(0,1fr);gap:14px;padding:12px;border-radius:18px;background:var(--card);align-items:center}
.li img{width:88px;height:88px;border-radius:10px;object-fit:cover}
.li h4{font-size:15px;line-height:1.35}
.li .m{font-size:12px;color:var(--ink-3);margin:3px 0 10px}

/* ===== 浮层 / 抽屉 ===== */
.sov{position:fixed;inset:0;z-index:90;background:rgba(20,20,24,.38);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.sheet{width:min(480px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--card);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:16px;animation:rise .32s var(--ease);position:relative}
.sheet h3{font-size:22px;font-weight:900;padding-right:44px}
.sheet .x-close{top:16px;right:16px}
.sheet > *{flex-shrink:0}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pays button{height:64px;border-radius:14px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:14px;transition:all .15s}
.pays button i{width:18px;height:18px;border-radius:5px;background:var(--c)}
.pays button.on{background:var(--card);box-shadow:inset 0 0 0 2px var(--ink)}
.sum{display:flex;flex-direction:column;gap:8px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{border-top:1px dashed var(--rule-2);padding-top:12px;font-weight:700;align-items:baseline}
.sum .tot b{font:900 34px/1 var(--f-b)}
.done{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0;text-align:center}
.ring-p{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--ink) calc(var(--p) * 1%),var(--paper) 0);display:grid;place-items:center}
.ring-p::after{content:"";width:62px;height:62px;border-radius:50%;background:var(--card)}
.menu{position:absolute;right:var(--g);top:calc(var(--hd) - 4px);z-index:70;width:280px;background:var(--card);border-radius:18px;padding:8px;box-shadow:0 20px 50px rgba(20,20,24,.18);animation:rise .22s var(--ease)}
.menu a,.menu button.mi{display:flex;align-items:center;justify-content:space-between;width:100%;height:42px;padding:0 12px;border-radius:10px;font-size:14.5px;text-align:left}
.menu a:hover,.menu button.mi:hover{background:var(--paper)}
.menu hr{border:0;border-top:1px solid var(--rule);margin:6px 4px}
.menu .who{display:flex;gap:10px;align-items:center;padding:10px 12px 12px}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--paper);border-radius:12px}
.roles button{height:32px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.roles button.on{background:var(--ink);color:var(--paper)}
.srch{position:fixed;inset:0;z-index:95;background:var(--paper);overflow-y:auto;animation:fade .18s}
.srch-in{max-width:960px;margin:0 auto;padding:clamp(18px,4vw,48px) var(--g) 80px}
.srch input{width:100%;border:0;background:transparent;outline:0;font:900 clamp(34px,6vw,72px)/1.1 var(--f-b);font-stretch:110%;letter-spacing:-.02em;padding:10px 0;border-bottom:3px solid var(--ink)}
.srch input::placeholder{color:var(--rule-2)}
.sq-w{position:relative}
.srch .sq-w input{padding-right:clamp(48px,7vw,72px)}
.srch input::-webkit-search-cancel-button,.srch input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.sq-x{position:absolute;right:0;top:50%;width:clamp(34px,4.4vw,44px);height:clamp(34px,4.4vw,44px);margin-top:calc(clamp(34px,4.4vw,44px) / -2);border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper);opacity:0;transform:scale(.6) rotate(-90deg);pointer-events:none;transition:opacity .18s,transform .28s var(--spring)}
.sq-x svg{width:46%;height:46%}
.sq-w.has .sq-x{opacity:1;transform:none;pointer-events:auto}
.sq-x:active{transform:scale(.88)}
.sh-hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh-clr{font-size:12.5px;color:var(--ink-3);padding:6px 2px}
.sh-clr:hover{color:var(--ink)}
.sh-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sh-c{padding:0;gap:0;max-width:100%;transition:opacity .16s,transform .16s}
.sh-t{display:inline-flex;align-items:center;gap:6px;height:100%;padding:0 4px 0 12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(60vw,320px);color:inherit}
.sh-t svg{width:14px;height:14px;flex:none;opacity:.55}
.sh-d{width:30px;height:100%;display:grid;place-items:center;color:var(--ink-3);flex:none;border-radius:0 999px 999px 0}
.sh-d svg{width:11px;height:11px}
.sh-d:hover{color:var(--ink);background:var(--rule)}
.sh-c.out,.sh-g.out{opacity:0;transform:scale(.92)}
.sh-g.out{transform:translateY(-6px)}
.s-tabs{display:flex;gap:4px;margin:22px 0 12px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);z-index:2}
.s-tabs button{position:relative;display:inline-flex;align-items:baseline;gap:6px;padding:12px 14px 13px;font-size:15px;font-weight:600;color:var(--ink-3);transition:color .18s}
.s-tabs button i{font-style:normal;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;opacity:.7}
.s-tabs button.on{color:var(--ink)}
.s-tabs button.on::after{content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:3px;background:var(--ink);animation:tabIn .22s var(--spring)}
.s-tabs button.nil{opacity:.45}
@keyframes tabIn{from{transform:scaleX(.3)}to{transform:none}}
.sr-g{margin-top:28px}
.sr-g h4{margin-bottom:10px}
.sr-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}
.sr-row:hover,.sr-row.kb-on{background:var(--card)}
.sr-row img,.sr-row .av{width:52px;height:52px;border-radius:10px;object-fit:cover}
.sr-row .av{border-radius:50%}
.sr-row b{font-weight:700;display:block}
.sr-row span{font-size:12.5px;color:var(--ink-3)}
mark{background:var(--yellow);color:inherit;border-radius:3px;padding:0 1px}

/* 迷你播放器 */
.player{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:88;display:flex;align-items:center;gap:12px;height:56px;padding:0 8px 0 10px;border-radius:999px;background:var(--ink);color:var(--paper);box-shadow:0 14px 40px rgba(20,20,24,.3);max-width:calc(100vw - 32px);animation:pup .3s var(--spring)}
@keyframes pup{from{transform:translate(-50%,30px);opacity:0}}
.player .eq{display:flex;align-items:flex-end;gap:2px;height:20px;width:22px;flex:none}
.player .eq i{flex:1;background:var(--c,var(--pink));border-radius:1px;animation:eq .7s ease-in-out infinite alternate}
.player .eq i:nth-child(2){animation-delay:-.3s}.player .eq i:nth-child(3){animation-delay:-.55s}.player .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%{height:20%}100%{height:100%}}
.player .t{min-width:0;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.player .t b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.player .t span{font:600 11px/1 var(--f-b);opacity:.6;white-space:nowrap}
.player .pbtn{width:40px;height:40px}
.player .pbtn svg{width:14px;height:14px}

/* 帖子浮层打开时，播放器移到不挡内容的位置，始终可见 */
body.post-open .player{bottom:auto;top:calc(10px + env(safe-area-inset-top,0px));animation:none}
@media (min-width:761px) and (min-height:561px){ body.post-open.playing .ov{padding-top:84px;transition:padding .25s var(--ease)} body.post-open.playing .post{height:min(860px,calc(100vh - 108px))} }
/* 吐司 */
.toasts{position:fixed;left:50%;top:calc(var(--hdy) + 12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;height:42px;padding:0 18px 0 8px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:14px;animation:tin .32s var(--spring);white-space:nowrap}
.toast i{width:26px;height:26px;border-radius:50%;background:var(--c,var(--green));display:grid;place-items:center;color:var(--ink)}
.toast i svg{width:13px;height:13px}
@keyframes tin{from{transform:translateY(-14px) scale(.9);opacity:0}}
.burst{position:fixed;pointer-events:none;z-index:130;width:8px;height:8px;border-radius:50%;animation:burst .6s var(--ease) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

/* 手机底栏 */
.tb{display:none}
.empty{padding:56px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--ink-2)}
.empty .x{font-size:clamp(40px,7vw,80px);color:var(--rule-2)}
footer{padding:48px var(--g) 140px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;border-top:1px solid var(--rule)}
footer .x{font-size:clamp(56px,10vw,140px)}
footer .x span{color:var(--pink)}
footer p{font-size:13px;color:var(--ink-3);text-align:right;line-height:1.8}

/* ===== 响应式 ===== */
@media (max-width:1240px){ .mason{column-count:3} .sbtn{min-width:0} .sbtn .t{display:none} .sbtn kbd{display:none} .sbtn{padding:0;width:40px;justify-content:center} }
@media (max-width:1020px){
  .pp{grid-template-columns:1fr}
  .info{position:static}
  .post{grid-template-columns:1fr;grid-template-rows:minmax(0,46%) minmax(0,1fr)}
  .dash{grid-template-columns:1fr}
  .snav{position:sticky;top:calc(var(--hdy) + env(safe-area-inset-top,0px));z-index:15;flex-direction:row;overflow-x:auto;background:var(--paper);padding-block:8px;scrollbar-width:none;margin-inline:calc(var(--g) * -1);padding-inline:var(--g)}
  .snav::-webkit-scrollbar{display:none}
  .snav button{flex:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cats{grid-template-columns:repeat(7,minmax(150px,1fr));overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--g) * -1);padding-inline:var(--g)}
  .cats::-webkit-scrollbar{display:none}
  .up{grid-template-columns:1fr}
  .prof{grid-template-columns:auto minmax(0,1fr)}
  .prof .acts{grid-column:1/-1}
}
@media (max-width:760px){
  :root{--hd:56px;--tbh:62px;--bbh:62px}
  .nav,.hd .pill.post-btn{display:none}
  .hd{justify-content:space-between}
  .tb{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding:0 6px env(safe-area-inset-bottom,0px);height:calc(var(--tbh) + env(safe-area-inset-bottom,0px));box-sizing:border-box;align-items:stretch}
  .tb a,.tb button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:11px;line-height:14px;font-weight:500;color:var(--ink-3)}
  .tb svg{width:22px;height:22px}
  .tb .on{color:var(--ink)}
  .tb a{position:relative}
  .tb .bdg{right:calc(50% - 22px);top:0}
  .tb .plus{align-self:center}
  .tb .plus span{width:48px;height:36px;border-radius:12px;background:var(--pink);color:var(--ink);display:grid;place-items:center}
  .tb .plus svg{width:20px;height:20px}
  .mason{column-count:2;column-gap:10px}
  .mason > *{margin-bottom:18px}
  .card h3{font-size:14px}
  .card .meta{font-size:11.5px}

  .qcv{min-height:180px;padding:14px}
  .qcv .q{font-size:64px}
  .qcv p{font-size:14.5px}
  .grid-p{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 10px}
  .slv h3{font-size:14px}
  .price{font-size:17px}
  .slv .pv .pbtn{width:40px;height:40px}
  .ov{padding:0}
  .post{height:100%;border-radius:0;display:block;overflow-y:auto}
  .post .media{aspect-ratio:1;max-height:62vh}
  .post .side{min-height:auto}
  .post .scroll{overflow:visible;padding-bottom:90px}
  .post .foot{position:fixed;left:0;right:0;bottom:0;z-index:6}
  .player{bottom:calc(var(--tbh) + 14px + env(safe-area-inset-bottom,0px))}
  body:has(.buybar) .player{bottom:calc(var(--tbh) + var(--bbh) + 16px + env(safe-area-inset-bottom,0px))}
  body.post-open .player{top:auto;bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .sov{align-items:flex-end;padding:0}
  .sheet{width:100%;border-radius:22px 22px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));animation:sup .32s var(--ease)}
  @keyframes sup{from{transform:translateY(100%)}}
  .buybar{display:flex;position:fixed;left:0;right:0;bottom:calc(var(--tbh) + env(safe-area-inset-bottom,0px));z-index:55;min-height:var(--bbh);box-sizing:border-box;padding:10px var(--g);gap:10px;align-items:center;background:var(--card);border-top:1px solid var(--rule)}
  .buybar .price{font-size:24px;margin-right:auto}
  .syn{grid-template-columns:1fr}
  .pad{aspect-ratio:1.05}
  .kpi{min-height:120px}
  .q-card{grid-template-columns:1fr}
  .q-card img{min-height:0;aspect-ratio:2}
  .fg{grid-template-columns:1fr}
  .hero{height:auto;aspect-ratio:3/4;min-height:0;max-height:78vh}
  .inks{top:auto;bottom:auto;top:96px;transform:none}
  .hero-top .lab{display:none}
  .prof{grid-template-columns:1fr}
  .prof .av.xl{width:96px;height:96px;font-size:32px}
  .menu{left:12px;right:12px;width:auto}
  footer p{text-align:left}
  .toasts{top:auto;bottom:calc(var(--tbh) + 22px + env(safe-area-inset-bottom,0px))}
  .lib{grid-template-columns:1fr}
}

/* 海报位：竖屏 / 窄屏把图形区放在上方，文字在下方流式排布，永不互相挤压 */
@media (max-width:760px), (max-aspect-ratio:4/5){
  .bn{height:auto;min-height:0;padding-top:min(78vw,46vh);padding-top:min(78vw,46svh)}
  .bn-txt{max-width:none}
  .bn-top{display:none}
}
/* 横屏手机 / 很矮的窗口 */
@media (max-height:560px) and (min-aspect-ratio:5/4){
  .bn{height:calc(100vh - var(--hd));height:calc(100svh - var(--hd));min-height:300px;padding-bottom:12px}
  .bn-txt{gap:6px}
  .bn-txt h2{font-size:clamp(40px,17vh,120px)}
  .bn-txt p{font-size:14px}
  .bn-txt .pill.lg{height:44px;padding:0 20px;font-size:15px}
  .bn-ctl{margin-top:10px}
  .bn-a{width:40px;height:40px}
  .bn-top{display:none}
}
/* 帖子浮层：矮屏也用单列可滚动布局 */
@media (max-height:560px) and (min-width:761px){
  .ov{padding:0}
  .post{height:100%;border-radius:0;display:block;overflow-y:auto}
  .post .media{height:70vh}
  .post .scroll{overflow:visible;padding-bottom:90px}
  .post .foot{position:sticky;bottom:0;z-index:6}
  .navp{display:none}
}
.ph h1,.prof h1,.shopband .x,footer .x{white-space:nowrap}
@media (max-width:1100px){ .catband{grid-template-columns:repeat(2,minmax(0,1fr))} }
.kpis.k3{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.syn{align-items:stretch}
.xy{aspect-ratio:auto;min-height:220px;height:100%}
@media (max-width:1020px){ .xy{aspect-ratio:1.5;height:auto;min-height:0} }
@media (hover:hover){ .card:hover .cv > img,.slv:hover .cv > img{transform:scale(1.035)} }


/* ===== 深色模式 ===== */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --paper:#121214; --card:#1C1C21; --ink:#ECECE6; --ink-2:#B4B4BC; --ink-3:#7D7E88; --rule:#2B2B31; --rule-2:#3E3E46;
  --pink-t:#3B1A2C; --blue-t:#192146; --yellow-t:#383114; --orange-t:#3C2015; --green-t:#11301E; --violet-t:#281F45;
} }
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#121214; --card:#1C1C21; --ink:#ECECE6; --ink-2:#B4B4BC; --ink-3:#7D7E88; --rule:#2B2B31; --rule-2:#3E3E46;
  --pink-t:#3B1A2C; --blue-t:#192146; --yellow-t:#383114; --orange-t:#3C2015; --green-t:#11301E; --violet-t:#281F45;
}
/* 压在彩色色块上的文字，两种模式都用深墨 */
.tag,.pill.pk,.pill.cc,.cat:not(.all),.card .cv,.post .media,.stage,.shopband,.kpi.cc,.catband a,.stk,.av,.flag,mark,.pays button i,.toast i,.sellrow:hover,.tplp button .ic{color:var(--on)}
.stamp{color:var(--sc,var(--on))}
/* 试听台是印在纸上的实物：两种模式都保持纸色 */
.wbox,.pad,.syn-r,.xy,.kb .w{background:var(--sheet)}
.pad.hit,.kb .w.hit{background:var(--on);color:var(--sheet)}
.pad kbd{color:#8E8F98;border-color:rgba(20,20,24,.15)}
.kb .b{background:var(--on)} .kbh .oct button{background:var(--on);color:var(--sheet)}
.kb .b.hit{background:var(--sheet);color:var(--on);box-shadow:inset 0 0 0 2px var(--on)}
.prs button{color:var(--on)}
.prs button.on,.stage .seg button.on{background:var(--on);color:var(--sheet)}
.stage .seg button{color:var(--on)}
.stage .rng i,.stage .rng b,.stage .tl i,.stage .tl b,.xy .knob{background:var(--on)}
.stage .rng b{box-shadow:0 0 0 4px var(--sheet)}
.xy .knob{box-shadow:0 0 0 5px var(--sheet),0 0 0 6.5px var(--on)}
.stage .pbtn.on{background:var(--on);color:var(--sheet)}
.bn{background:var(--paper)}
html.theming,html.theming *{transition:background-color .35s ease,color .35s ease,border-color .35s ease,box-shadow .35s ease!important}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .bn-txt h2{mix-blend-mode:normal} :root:not([data-theme="light"]) .bn-seg button i{background:rgba(255,255,255,.16)} :root:not([data-theme="light"]) .grain::after{opacity:.25} :root:not([data-theme="light"]) .palp button i{mix-blend-mode:screen} }
:root[data-theme="dark"] .bn-txt h2{mix-blend-mode:normal}
:root[data-theme="dark"] .bn-seg button i{background:rgba(255,255,255,.16)}
:root[data-theme="dark"] .grain::after{opacity:.25}
:root[data-theme="dark"] .palp button i{mix-blend-mode:screen}
.thm svg{width:18px;height:18px}
[data-qbox] > canvas.live{position:absolute;inset:0;width:100%;height:100%;z-index:2;display:block}
.vtag{position:absolute;left:10px;top:10px;z-index:3}
.cmode{display:inline-flex;background:var(--paper);border-radius:999px;padding:3px}
.cmode button{height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2)}
.cmode button.on{background:var(--ink);color:var(--paper)}
.cvis{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start}
.cvis .pvw{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--sheet)}
.cvis .pvw img{width:100%;height:100%;object-fit:cover}
.cvis .pvw .pv{position:absolute;right:6px;bottom:6px;z-index:3}
.cvis .cvp{grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.cvis .cvp button span{display:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}

/* ===== 回到顶部（外圈 = 阅读进度） ===== */
.totop{--fab-b:24px;--fab-p:0px;position:fixed;right:max(16px,calc(var(--g) - 8px));bottom:calc(var(--fab-b) + var(--fab-p) + env(safe-area-inset-bottom,0px));z-index:87;width:50px;height:50px;border-radius:50%;background:var(--card);color:var(--ink);box-shadow:0 6px 22px rgba(20,20,24,.16);display:grid;place-items:center;opacity:0;transform:translateY(14px) scale(.86);pointer-events:none;transition:opacity .2s,transform .32s var(--spring),bottom .25s var(--ease)}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.totop .rg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);fill:none;stroke-width:3;overflow:visible}
.totop .rg circle{stroke:var(--pink);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p,0) * 100);transition:stroke-dashoffset .12s linear}
.totop .ar{width:20px;height:20px;transition:transform .2s var(--ease)}
.totop:hover .ar{transform:translateY(-3px)}
.totop:active{transform:scale(.9)}
body.post-open .totop{--fab-b:104px}
/* ===== 帖子迷你栏：手机上滚过图片后出现，返回键始终浮在左上 ===== */
.pmini{display:none}
@media (max-width:760px), (max-height:560px) and (min-width:761px){
  .pback{position:fixed;z-index:8;box-shadow:0 2px 12px rgba(20,20,24,.18)}
  .pmini{display:flex;align-items:center;gap:10px;position:fixed;left:0;right:0;top:0;z-index:7;height:calc(68px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0 68px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--rule);transform:translateY(-100%);transition:transform .28s var(--ease)}
  .pmini b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}

  .post.pm-on .pback{box-shadow:none}
  body.post-open .totop{--fab-b:76px}
}
@media (max-width:760px){
  .totop{--fab-b:calc(var(--tbh) + 14px);width:46px;height:46px}

  body.playing .totop{--fab-p:66px}
}
@media (prefers-reduced-motion:reduce){ .totop,.pmini{transition:none} }

/* ===== 可擦洗波形 ===== */
canvas[data-wave]{cursor:pointer;touch-action:pan-y;outline:0;border-radius:6px}
canvas[data-wave]:focus-visible{box-shadow:0 0 0 2px var(--on)}
.wtip{position:fixed;left:0;top:0;z-index:150;pointer-events:none;opacity:0;transition:opacity .12s}

.wtip.on{opacity:1}
.wtip{font:700 12px/1 var(--f-b);font-variant-numeric:tabular-nums;color:var(--paper);background:var(--ink);padding:6px 8px;border-radius:8px;margin:-34px 0 0 0;translate:-50% 0;white-space:nowrap}
.pbtn.ld{pointer-events:none;position:relative}
.pbtn.ld svg{opacity:0}
.pbtn.ld::after{content:"";position:absolute;inset:30%;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 极窄屏（折叠屏外屏 / 老款小屏） ===== */
@media (max-width:374px){
  .hd{gap:8px} .hd.has-back{gap:8px} .hd-r{gap:6px}

  .hd .av{width:34px;height:34px}
  .wm{font-size:22px}
}
@media (max-width:339px){
  .mason{column-count:1}
  .grid-p{grid-template-columns:minmax(0,1fr)}

  .buybar .price{font-size:20px}
}
/* 声音卡：标题字号跟着卡片宽度走，窄卡片里标题独占一行，播放键仍在右下角 */
.acv{container-type:inline-size}
.acv .t{font-size:clamp(16px, calc((100cqi - 96px) / 7), 40px);min-width:0;overflow-wrap:anywhere}
@container (max-width:250px){
  .acv{gap:8px;padding:12px}
  .acv canvas{height:auto;flex:1;min-height:28px}
  .acv .row:last-child{flex-wrap:wrap;gap:6px}
  .acv .t{flex:1 0 100%;font-size:min(12cqi, 26px)}
  .acv .row:last-child .pbtn{margin-left:auto;width:40px;height:40px}
}

/* 很矮的横屏（折叠屏外屏横放 / 横屏小手机）：底栏只留图标，内容区更大 */
@media (max-width:760px) and (max-height:430px), (max-height:430px) and (min-aspect-ratio:3/2){
  :root{--tbh:46px;--bbh:52px;--hd:48px}
  .tb a,.tb button{font-size:0;gap:0}
  .tb svg{width:20px;height:20px}
  .tb .plus span{height:30px}
  .buybar{padding-block:6px}
  .buybar .price{font-size:20px}
}
/* 手机版帖子：媒体区始终铺满宽度，高度封顶，不再出现半边空白 */
@media (max-width:760px){
  .post .media{aspect-ratio:auto;width:100%;height:min(100vw, 62vh);max-height:none}
}
/* 极窄屏的细节 */
@media (max-width:339px){
  .catband{grid-template-columns:minmax(0,1fr)}
  .pad{padding:7px 7px}
  .pad b{font-size:8.5px;letter-spacing:-.02em}
}
.kpi{container-type:inline-size;min-width:0}
.kpi b{font-size:clamp(20px, min(3.2vw, 17cqi), 48px)}

/* ===== 文字封面 ===== */
.tcv{position:relative;container-type:inline-size;width:100%;aspect-ratio:4/5;background:var(--tbg);color:#141418;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:13% 9% 8%;text-align:left}
.tcv::before{content:"";position:absolute;left:9%;top:6.5%;width:11%;height:4px;border-radius:3px;background:var(--tac)}
.tcv p{position:relative;z-index:1;margin:auto 0;font:800 clamp(13px, calc(var(--k) * 1cqi), var(--cap, 40px))/1.36 var(--f-b);letter-spacing:-.005em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lc,7);overflow:hidden;overflow-wrap:anywhere;text-wrap:pretty}
.tcv .tq{position:absolute;right:-5cqi;bottom:-17cqi;font:900 74cqi/1 var(--f-x);color:var(--tac);mix-blend-mode:multiply;pointer-events:none;user-select:none}
.tcv .tcb{position:relative;z-index:1;flex:none;font:600 clamp(10px,4.2cqi,13px)/1 var(--f-b);opacity:.55}
.tcv.post{position:absolute;inset:0;width:auto;aspect-ratio:auto;padding:clamp(48px,11%,96px) clamp(24px,8%,64px) clamp(24px,6%,48px);--cap:52px;--lc:14}
.tcv.post::before{left:clamp(24px,8%,64px);top:clamp(26px,6%,56px);width:56px;height:5px}
.tcv.post p{font-size:clamp(18px, calc(var(--k) * .7cqi), var(--cap))}
.tcv.post .tq{font-size:56cqi;right:-3cqi;bottom:-12cqi}
.tcv.post .tcb{font-size:14px}
.card.tpost .bd h3{display:none}
/* ===== 发布面板 ===== */
.sheet.cp{width:min(560px,100%);gap:14px}
.cp-top{display:flex;align-items:center;gap:12px;padding-right:44px}
.cp-mode{background:var(--paper);border-radius:999px;padding:4px;display:inline-flex}
.cp-mode button{height:40px;padding:0 22px;border-radius:999px;font:800 16px/1 var(--f-b);color:var(--ink-2)}
.cp-mode button.on{background:var(--ink);color:var(--paper)}
#cpWrap{display:flex;flex-direction:column;gap:12px;min-width:0}
.cp-t{height:48px;font-size:16px;font-weight:700}
.cp-b{min-height:110px;resize:vertical;font-size:15px;line-height:1.6}
.cp-att{display:flex;gap:8px;flex-wrap:wrap}
.cp-add{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:999px;background:var(--paper);font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);transition:background .15s}
.cp-add:hover{background:var(--rule)}
.cp-demo{font-size:12.5px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;padding:0 4px}

.cp-add svg{width:18px;height:18px}
.cp-imgs{display:flex;gap:8px;flex-wrap:wrap}
.cp-im{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}
.cp-im > button:first-child{width:100%;height:100%}

.cp-im.on{box-shadow:0 0 0 2.5px var(--ink)}
.cp-im.on::after{content:"封面";position:absolute;left:4px;bottom:4px;font:700 10px/1 var(--f-b);background:var(--ink);color:var(--paper);padding:3px 5px;border-radius:5px;pointer-events:none}
.cp-im .x,.cp-chip .x{position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:rgba(20,20,24,.7);color:#fff;display:grid;place-items:center}
.cp-im .x svg,.cp-chip .x svg{width:11px;height:11px}
.cp-chip{position:relative;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 36px 0 12px;border-radius:12px;background:var(--paper);font-size:13.5px;min-width:0}
.cp-chip > svg{width:18px;height:18px;flex:none}
.cp-chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-chip em{font-style:normal;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-left:auto}
.cp-chip .x{top:50%;margin-top:-10px;right:8px}
.cp-chip + .cp-chip{margin-top:8px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;margin-left:auto;flex:none}
.cp-cover{display:grid;grid-template-columns:min(190px,46%) minmax(0,1fr);gap:16px;align-items:start;padding:14px;border-radius:16px;background:var(--paper)}
.cp-pv{pointer-events:none;min-width:0}

.cp-pv .card .bd{padding-bottom:0}
.cp-side{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}
.cp-kind{display:inline-flex;align-items:center;gap:7px;font:800 15px/1 var(--f-b)}
.cp-kind i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cp-pals{display:flex;gap:8px;flex-wrap:wrap}
.cp-pals button{width:34px;height:34px;border-radius:50%;background:var(--b);box-shadow:inset 0 0 0 1px rgba(20,20,24,.12);display:grid;place-items:center}
.cp-pals button i{width:12px;height:12px;border-radius:50%;background:var(--a)}
.cp-pals button.on{box-shadow:0 0 0 2.5px var(--ink)}
.cp-side .cvp{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;width:100%}
.cp-side .cvp button{border-radius:8px;overflow:hidden;aspect-ratio:1}
.cp-side .cvp button img{width:100%;height:100%;display:block}

.cp-pick{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px;border-radius:18px;background:var(--c);color:var(--on);text-align:left;min-height:180px;position:relative;transition:transform .2s var(--spring)}
.cp-pick:hover{transform:translateY(-3px)}
.cp-pick .g{width:46px;height:46px;margin-bottom:auto}
.cp-pick .g svg{width:100%;height:100%}
.cp-pick b{font:900 20px/1.1 var(--f-b)}
.cp-pick span:not(.g){font-size:13px;opacity:.75}

.cp-inv{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px;border-radius:18px;background:var(--yellow-t)}
.cp-inv .g{width:40px;height:40px;color:var(--pink)} .cp-inv .g svg{width:100%;height:100%}

@media (max-width:420px){ .cp-cover{grid-template-columns:minmax(0,1fr)} .cp-pv{max-width:220px} .cp-prod{grid-template-columns:minmax(0,1fr)} .cp-pick{min-height:120px} }

/* ===== 发布 · 附上用到的素材 ===== */
.cp-sw{display:flex;align-items:center;gap:10px;width:100%;padding:6px 2px;text-align:left;font-size:15px}

.sw{position:relative;width:42px;height:26px;border-radius:999px;background:var(--rule-2);flex:none;transition:background .2s}
