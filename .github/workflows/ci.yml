name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 静态站无需构建；测试使用 Node 内置模块，不接入线上服务。
      - name: 完整前端回归测试
        run: node --test test/*.test.cjs tests/*.mjs
